<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leverage Legends</title>
<style>
:root{--bg:#0E1630;--panel:#18233F;--panel2:#22305A;--ink:#FFF6E0;--dim:#B9C2DC;--orange:#FF8A1F;--green:#3DDC84;--red:#FF7B7B;--yellow:#FFD23F;--blue:#6BB6FF;--awn:#E63946;--ac:#4DA3FF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:10px 14px;background:var(--panel2);color:var(--ink);font-weight:700;touch-action:manipulation;min-width:0}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn-go{background:var(--green);color:#06210F}
.btn-ghost{background:transparent;border:2px solid var(--panel2)}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 14px 40px}
.awning{height:22px;background:repeating-linear-gradient(90deg,var(--yellow) 0 28px,var(--awn) 28px 56px);border-radius:0 0 10px 10px;margin:0 -14px 12px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-bottom:10px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--panel2)}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;min-width:0}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.prog{font-size:.85rem;color:var(--dim);white-space:nowrap}
.cash{margin-left:auto;font-weight:800;font-size:1.15rem;color:var(--green)}
.iconbtn{min-width:48px;padding:6px;background:var(--panel)}
.card{background:var(--panel);border-radius:16px;padding:14px;margin:0 0 12px;border-left:6px solid var(--ac)}
.card.plain{border-left:0}
.pill{display:inline-block;background:var(--ac);color:#06122B;font-weight:800;border-radius:999px;padding:3px 12px;font-size:.85rem;margin-bottom:8px}
h1{font-size:2rem;line-height:1.1;margin:.2em 0}
h2{font-size:1.25rem;margin:.1em 0 .3em;line-height:1.2}
h3{font-size:1.02rem;margin:.1em 0 .5em}
p{margin:.35em 0}
h1,h2,h3,p,td,th,.bubble,button{overflow-wrap:break-word}
.dim{color:var(--dim)}
.big{font-size:2rem;font-weight:900;line-height:1.15}
.forecast{background:#0B1228;border-radius:12px;padding:10px 12px;margin-top:8px}
.forecast b{display:block;font-size:1.6rem}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.met{background:#0B1228;border-radius:10px;padding:8px 10px;min-width:0}
.met span{display:block;font-size:.8rem;color:var(--dim)}
.met b{font-size:1.15rem}
.mix{display:flex;align-items:center;gap:14px}
.mix svg{width:104px;height:104px;flex:0 0 104px}
.legend{font-size:.88rem;line-height:1.75;margin:6px 0 0}
.sw{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:6px}
.chart svg{width:100%;height:auto;display:block}
.gauge{background:#0B1228;border-left:4px solid var(--yellow);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.95rem}
.moves{display:grid;gap:8px}
.mv{text-align:left;font-weight:600;border:2px solid transparent;padding:10px 12px}
.mv b{display:block}
.mv small{display:block;font-weight:500;margin-top:2px}
.mv.on{background:var(--orange);color:#231000}
.mango{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.mface{flex:0 0 52px;height:52px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:1.8rem;position:relative}
.mface:before,.mface:after{content:"";position:absolute;top:-6px;border:9px solid transparent;border-bottom:13px solid var(--orange)}
.mface:before{left:2px;transform:rotate(-25deg)}.mface:after{right:2px;transform:rotate(25deg)}
.bubble{background:var(--ink);color:#1B1B2A;border-radius:14px;padding:10px 12px;flex:1;font-weight:600;min-width:0}
.ticker{font-size:3rem;font-weight:900;text-align:center;margin:4px 0}
.up{color:var(--green)}.down{color:var(--red)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.bar{background:#0B1228;border-radius:12px;padding:10px;text-align:center;min-width:0}
.bar .col{height:80px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0}
.bar .fill{width:56px;border-radius:8px 8px 0 0;background:var(--green);min-height:4px;transition:height .8s}
.bar .fill.neg{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--panel2)}
td.r,th.r{text-align:right}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,10,24,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.hold{width:220px;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:22px}
.hold i{display:block;height:100%;background:var(--ink);width:0}
.receipt{background:var(--ink);color:#1B1B2A;border-radius:6px;padding:18px 16px;margin-bottom:12px}
.receipt h2{text-align:center;letter-spacing:2px}
.receipt .line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #9A957F;padding:5px 0}
.receipt .line b{text-align:right}
.receipt .total{font-size:2.2rem;font-weight:900;text-align:center;margin:10px 0 2px}
.receipt th,.receipt td{border-bottom:1px dashed #9A957F}
.receipt .copy{background:#1B1B2A;color:var(--ink);border-radius:8px;padding:10px;text-align:center;font-weight:800;margin-top:12px}
.field{display:block;margin:10px 0}
.field span{display:block;font-weight:700;margin-bottom:4px}
.field input{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--panel2);background:#0B1228;padding:8px 12px;font-size:1.15rem}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hgrid button{display:flex;flex-direction:column;align-items:center;font-size:.85rem;padding:8px 2px}
.hgrid button i{font-style:normal;font-size:1.8rem}
.hgrid button.on{background:var(--orange);color:#231000}
.err{color:var(--yellow);font-weight:700;min-height:1.4em}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:30;pointer-events:none;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.amt{background:#0B1228;border-radius:12px;padding:10px 12px;margin-top:10px}
.amt input[type=range]{width:100%;height:44px;accent-color:var(--orange)}
.amtrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.amtrow button{padding:8px 2px;font-size:.85rem;white-space:nowrap}
.mixbar{display:flex;height:40px;border-radius:10px;overflow:hidden;margin:10px 0 6px;border:2px solid #0B1228}
.mixbar div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#0B1228;white-space:nowrap;overflow:hidden}
.mixleg{display:flex;justify-content:space-between;gap:6px;font-size:.8rem;flex-wrap:wrap}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim);margin:-6px 0 8px}
#mix{width:100%;height:44px;accent-color:#B9C2DC;margin-top:6px}
.mixbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mixbtns button{min-height:44px;padding:6px 4px;font-size:.9rem}
.tipbtn{min-height:44px;min-width:44px;padding:0;background:transparent;color:var(--blue);font-size:1.15rem;vertical-align:middle;margin:-10px 0 -10px 2px}
.tip{background:#0B1228;border-left:4px solid var(--blue);border-radius:8px;padding:8px 10px;margin:4px 0 8px;font-size:.92rem;font-weight:500}
.new{display:inline-block;background:var(--yellow);color:#231000;border-radius:6px;padding:0 6px;font-size:.75rem;font-weight:800;margin-left:6px}
@media(max-width:380px){html,body{font-size:16px}#app{padding:0 10px 32px}.awning{margin:0 -10px 10px}.card{padding:12px}.ticker{font-size:2.5rem}.big{font-size:1.6rem}.receipt{padding:14px 10px}table{font-size:.8rem}.chip .nm{max-width:70px}.mix svg{width:88px;height:88px;flex-basis:88px}}
@media(min-width:900px){html,body{font-size:19px}#app{max-width:720px}.awning{margin:0 0 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script id="core">
/* ======================= CONSTANTS: tune here ======================= */
var CONFIG = {
  REFLECT_SECONDS: 6,          // held screen after the big loss
  S1: {
    START: 500,                // what the business is worth at the start
    RATES: [0.06, 0.075, 0.09], // card rate per season (24%, 30%, 36% a year) on each slice of debt, one slice = 1x your stake; borrowing more costs more
    MIN_MOVE: 50,              // the sliders move in steps of this much
    SIZE: 4,                   // each season the business invests this many times your stake; you fund the rest with card debt or a partner's money
    CHART_FROM: 0,             // the stake chart (EBIT-EPS style), shown from this season
    TIP_COST: 30,              // Mango's tip: a narrower, true forecast range, paid from your stake
    SEASONS: [                 // forecast range, result, and Mango's tip (never makes a result certain when the forecast does not)
      { lo: 0.10, hi: 0.30, ret: 0.18, tip: [0.15, 0.25] },
      { lo: 0.00, hi: 0.12, ret: 0.03, tip: [0.00, 0.08] },
      { lo: 0.15, hi: 0.40, ret: 0.30, tip: [0.25, 0.35] },
      { lo: -0.40, hi: 0.20, ret: -0.35, tip: [-0.40, 0.08] },
      { lo: -0.25, hi: 0.25, ret: 0.07, tip: [-0.05, 0.20] },
      { lo: 0.10, hi: 0.40, ret: 0.26, tip: [0.20, 0.32] }
    ]
  },
  S2: {
    START: 500,                // cash for anyone with no Stage 1 result on this device, and the floor for those who have one
    PRICE: 800, COST: 560, APP_FEE: 120,  // all Stage 2 dollar amounts are 4 times the original 200/140/30/300/270, so Stage 2 swings outweigh the Stage 1 head start
    RENT: 1200,                // stall rent, one month at a time
    LEASE_RENT: 1080,          // rent per month if you sign a lease
    LEASE_MONTHS: 3,
    LEASE_FROM: 1,             // the lease option opens in this month (0 = first month)
    STOCK: 20, CARD_STOCK: 40, CARD_APR: 0.24,
    CARD_FROM: 4,              // the credit card option opens in this month (0 = first month)
    TIP_COST: 120,             // Mango's tip, paid from cash
    MONTHS: [
      { lo: 8, hi: 18, buyers: 12, tip: [9, 15] },
      { lo: 4, hi: 12, buyers: 6, tip: [4, 11] },
      { lo: 0, hi: 16, buyers: 1, tip: [0, 11] },
      { lo: 12, hi: 24, buyers: 20, tip: [17, 22] },
      { lo: 6, hi: 16, buyers: 8, tip: [7, 11] },
      { lo: 5, hi: 40, buyers: 12, tip: [9, 18] }
    ]
  }
};
/* ======================= PURE GAME LOGIC ======================= */
function cents(x){ return Math.round(x * 100 + (x < 0 ? -1e-6 : 1e-6)) / 100; }
function roundCount(stage){ return stage === 2 ? CONFIG.S2.MONTHS.length : CONFIG.S1.SEASONS.length; }

/* ---- Stage 1: one business, six seasons. st = { E: business value, s: your share (0-1), D: debt, failed: 1 once broke, broke: season it happened, owed: what is still owed to the card } ---- */
function s1Rate(){ return CONFIG.S1.RATES[0]; }
/* Interest on debt D for an owner with stake own: each slice of debt (1x own) costs the next rate. */
function s1Interest(D, own){ var R = CONFIG.S1.RATES, t = 0, left = D, k; for (k = 0; k < R.length && left > 0; k++){ var sl = k === R.length - 1 ? left : Math.min(left, own); t += sl * R[k]; left -= sl; } return t; }
function s1Own(st){ return st.E * st.s; }
function s1NextRate(D, own){ var R = CONFIG.S1.RATES; return R[Math.min(R.length - 1, own > 0 ? Math.floor(D / own + 1e-9) : 0)]; }
function s1New(){ return { E: CONFIG.S1.START, s: 1, D: 0, failed: 0 }; }
function s1Stake(st){ return cents(st.E * st.s); }
function s1Partner(st){ return cents(st.E * (1 - st.s)); }
/* Each season the business invests SIZE x your stake. Your money goes in first; debt D pays for part of
   the rest and a partner's money pays for whatever is left. pre = { E: all owners' money, s: your share, D }.
   After the season the partner is paid out at value, so you start the next season owning 100%. */
function s1DebtMax(st){ return cents((CONFIG.S1.SIZE - 1) * s1Stake(st)); }
function s1Mix(st, D){
  var own = s1Stake(st), K = CONFIG.S1.SIZE * own, d = Math.max(0, Math.min(s1DebtMax(st), D || 0)), E = cents(K - d);
  return { E: E, s: E > 0 ? own / E : 1, D: cents(d), failed: st.failed };
}
function s1Run(st, i){
  var r = CONFIG.S1.SEASONS[i].ret, K = st.E + st.D, ebit = cents(K * r), interest = cents(s1Interest(st.D, s1Own(st))), net = cents(ebit - interest), E2 = cents(st.E + net), failed = E2 <= 0;
  return { ret: r, capital: cents(K), ebit: ebit, interest: interest, net: net, failed: failed, mine: cents(failed ? -st.E * st.s : net * st.s), unlev: cents(st.E * st.s * r),
    st: failed ? { E: 0, s: st.s, D: 0, failed: 1, broke: i + 1, owed: cents(-E2) } : { E: cents(E2 * st.s), s: 1, D: 0, failed: st.failed || 0 } };
}
/* path: list of debt amounts, one per season */
function s1Play(path){ var st = s1New(), i; for (i = 0; i < path.length; i++){ st = s1Run(s1Mix(st, path[i]), i).st; if (st.failed) return st; } return st; }
/* Best possible follows the rule: keep borrowing while your stake's return beats the rate on the next slice of debt. */
function s1Best(){
  var n = CONFIG.S1.SEASONS.length, st = s1New(), path = [], i, k;
  for (i = 0; i < n; i++){
    var own = s1Stake(st), mx = s1DebtMax(st), best = 0, bv = -1e9;
    for (k = 0; k <= CONFIG.S1.SIZE - 1; k++){ var d = Math.min(mx, k * own), v = s1StakeReturn(s1Mix(st, d), CONFIG.S1.SEASONS[i].ret); if (v > bv + 1e-9){ bv = v; best = d; } }
    path.push(best); st = s1Run(s1Mix(st, best), i).st;
  }
  return { v: s1Stake(st), path: path };
}
/* Return on your stake for a season return r, with and without the debt. The two lines cross where r equals the card's rate. */
function s1StakeReturn(st, r){ return ((st.E + st.D) * r - s1Interest(st.D, s1Own(st))) / st.E; }
function s1DFL(st, r){ var ebit = (st.E + st.D) * r, int = s1Interest(st.D, s1Own(st)); return ebit > int ? ebit / (ebit - int) : null; }

/* ---- Stage 2: one shop, six months. st = { cash, lease: months left on a lease } ---- */
function s2CardCost(){ var c = CONFIG.S2; return cents(c.CARD_APR / 12 * (c.CARD_STOCK - c.STOCK) * c.COST); }
function s2Margins(){ var c = CONFIG.S2; return { app: c.PRICE - c.COST - c.APP_FEE, stall: c.PRICE - c.COST }; }
function s2New(base){ return { cash: base == null ? CONFIG.S2.START : base, lease: 0 }; }
function s2Options(st, i){ if (st.lease > 0) return ['leased']; var o = ['app', 'stall']; if (i >= CONFIG.S2.LEASE_FROM && i + CONFIG.S2.LEASE_MONTHS <= CONFIG.S2.MONTHS.length) o.push('lease'); return o; }
function s2Rent(st, way){ return st.lease > 0 || way === 'lease' ? CONFIG.S2.LEASE_RENT : CONFIG.S2.RENT; }
function s2ProfitAt(buyers, sell, rent, card){
  var c = CONFIG.S2, m = s2Margins(), sales = Math.min(buyers, card ? c.CARD_STOCK : c.STOCK);
  return (sell === 'app' ? m.app * sales : m.stall * sales - rent) - (card ? s2CardCost() : 0);
}
function s2Play(st, i, way, card){
  var c = CONFIG.S2, M = c.MONTHS[i], sell = (way === 'app' && st.lease <= 0) ? 'app' : 'stall', rent = s2Rent(st, way), cd = i >= c.CARD_FROM && !!card;
  var profit = s2ProfitAt(M.buyers, sell, rent, cd), alt = s2ProfitAt(M.buyers, sell === 'app' ? 'stall' : 'app', c.RENT, cd);
  return { buyers: M.buyers, sell: sell, rent: sell === 'stall' ? rent : 0, card: cd, profit: profit, alt: alt, st: { cash: st.cash + profit, lease: way === 'lease' ? c.LEASE_MONTHS - 1 : Math.max(0, st.lease - 1) } };
}
function s2Range(){
  var n = CONFIG.S2.MONTHS.length, lo = 1e9, hi = -1e9, bestPath = null;
  (function go(st, i, path){
    if (i === n){ if (st.cash < lo) lo = st.cash; if (st.cash > hi){ hi = st.cash; bestPath = path.slice(); } return; }
    s2Options(st, i).forEach(function(w){ (i >= CONFIG.S2.CARD_FROM ? [false, true] : [false]).forEach(function(cd){ path.push(w + (cd ? '+card' : '')); go(s2Play(st, i, w, cd).st, i + 1, path); path.pop(); }); });
  })(s2New(), 0, []);
  return { lo: lo, hi: hi, path: bestPath };
}
function s2DOL(buyers, sell, rent, card){
  var m = s2Margins(), c = CONFIG.S2, sales = Math.min(buyers, card ? c.CARD_STOCK : c.STOCK), cm = (sell === 'app' ? m.app : m.stall) * sales, ebit = cm - (sell === 'app' ? 0 : rent), ebt = ebit - (card ? s2CardCost() : 0);
  return { dol: ebit > 0 ? cm / ebit : null, dtl: ebt > 0 ? cm / ebt : null };
}
if (typeof module !== 'undefined') module.exports = { CONFIG: CONFIG, cents: cents, s1Rate: s1Rate, s1New: s1New, s1DebtMax: s1DebtMax, s1Mix: s1Mix, s1Interest: s1Interest, s1NextRate: s1NextRate, s1Stake: s1Stake, s1Partner: s1Partner, s1Run: s1Run, s1Play: s1Play, s1Best: s1Best, s1StakeReturn: s1StakeReturn, s1DFL: s1DFL, s2CardCost: s2CardCost, s2Margins: s2Margins, s2New: s2New, s2Options: s2Options, s2Rent: s2Rent, s2ProfitAt: s2ProfitAt, s2Play: s2Play, s2Range: s2Range, s2DOL: s2DOL };
</script>

}

/* Sliders move in MIN_MOVE steps from $0; the last stop is the exact maximum, so Max goes all the way right. */

function begin(stage, name, hustle){
  var k = 'll3_n' + stage + '_' + name.toLowerCase(), n = (lsGet(k) || 0) + 1; lsSet(k, n);
  var from1 = stage === 2 ? lsGet('ll3_s1_' + name.toLowerCase()) : null, base = stage === 2 ? Math.max(CONFIG.S2.START, from1 || 0) : null;
  S = { v: 3, name: name, hustle: hustle, stage: stage, from1: from1, base: base, i: 0, phase: 'intro', st: stage === 1 ? s1New() : s2New(base), move: stage === 1 ? 'hold' : null, card: false, hist: [], seen: {}, attempt: n };
  ui.printed = 0; ui.over = 0; save(); render();
}
var acts = {
  mute: function(){ muted = !muted; lsSet('ll_mute', muted); render(); },
  hustle: function(v){ ui.hustle = v; ui.name = $('#f-name').value; render(); },
  start: function(v){ var n = cleanName($('#f-name').value); ui.name = n; if (!n){ ui.err = 'Type your name first.'; render(); return; } ui.err = ''; begin(+v, n, ui.hustle); },
  go: function(){ S.phase = 'decide'; save(); render(); },
  move: function(v){ if (S.phase !== 'decide' || S.stage !== 2) return; S.move = v; save(); SFX.pick(); render(); },
  mix: function(v){
    if (S.phase !== 'decide' || S.stage !== 1) return; var mx = s1DebtMax(S.st), st = CONFIG.S1.MIN_MOVE, a = s1D();
    a = v === 'max' ? mx : v === '0' ? 0 : v === '+' ? Math.min(mx, Math.floor(a / st + 1e-9) * st + st) : Math.max(0, Math.ceil(a / st - 1e-9) * st - st);
    S.dt = a; save(); SFX.pick(); render();
  },
  mango: function(){
    if (S.phase !== 'decide') return; S.tipped = S.tipped || {}; if (S.tipped[S.i]) return;
    var one = S.stage === 1, cost = (one ? CONFIG.S1 : CONFIG.S2).TIP_COST; if (headline() < cost * 2) return;
    if (one){ S.st = { E: cents(s1Stake(S.st) - cost), s: 1, D: 0, failed: S.st.failed }; }
    else S.st = { cash: cents(S.st.cash - cost), lease: S.st.lease };
    S.tipped[S.i] = 1; S.tipSpent = (S.tipSpent || 0) + cost; save(); SFX.pick(); render();
  },
  tip: function(v){ ui.tips[v] = !ui.tips[v]; render(); },
  card: function(v){ if (S.phase !== 'decide') return; S.card = v === '1'; save(); SFX.pick(); render(); },
  run: function(){
    if (S.phase !== 'decide') return; var i = S.i, e;
    if (S.stage === 1){
      var pre = s1Mix(S.st, s1D()), r = s1Run(pre, i), Pp = s1Partner(pre);
      e = { ret: r.ret, capital: r.capital, ebit: r.ebit, interest: r.interest, net: r.net, mine: r.mine, unlev: r.unlev, failed: r.failed, owed: r.failed ? r.st.owed : 0, pre: pre, own: pre.s, debt: pre.D, before: s1Stake(pre), after: r.failed ? 0 : s1Stake(r.st), label: 'Debt ' + m0(pre.D) + ' · partner ' + m0(Pp) };
      S.st = r.st;
    } else {
      var way = S.st.lease > 0 ? 'leased' : S.move;
      if (!way){ var h = $('#hint'); if (h) h.textContent = 'Choose the app or the stall first.'; return; }
      var p = s2Play(S.st, i, way, S.card);
      e = { buyers: p.buyers, sell: p.sell, rent: p.rent, card: p.card, profit: p.profit, alt: p.alt, way: way, pre: { cash: S.st.cash, lease: S.st.lease }, before: S.st.cash, after: p.st.cash, label: (p.sell === 'app' ? 'App' : way === 'lease' ? 'Stall, new lease' : way === 'leased' ? 'Stall, lease' : 'Stall') + (p.card ? ' + card' : '') };
      S.st = p.st;
    }
    S.hist[i] = e; S.phase = 'reveal'; save(); render();
  },
  next: function(){ if (S.phase !== 'reveal') return; if (ui.ov){ if (!ov.innerHTML){ clearTimeout(ovTimer); showReflect(S.hist[S.i]); } return; } closeOv(); if (S.i + 1 < N() && !(S.stage === 1 && S.hist[S.i].failed)){ S.i++; S.phase = 'decide'; S.dt = null; S.move = S.stage === 1 ? 'hold' : null; S.card = false; } else S.phase = 'debrief'; save(); render(); },
  closeov: function(){ closeOv(); },
  results: function(){ S.phase = 'results'; S.doneAt = Date.now(); if (S.stage === 1){ var k1 = 'll3_s1_' + S.name.toLowerCase(), prev = lsGet(k1); lsSet(k1, Math.max(prev || 0, s1Stake(S.st))); } save(); render(); },
  stage2: function(){ begin(2, S.name, S.hustle); },
  again: function(){ begin(S.stage, S.name, S.hustle); },
  home: function(){ ui.name = S.name; ui.hustle = S.hustle; S = null; save(); render(); },
  over: function(){ if (!ui.over){ ui.over = 1; render(); setTimeout(function(){ if (ui.over){ ui.over = 0; if (!ui.ov) render(); } }, 4000); return; } ui.over = 0; if (S){ ui.name = S.name; ui.hustle = S.hustle; } S = null; save(); closeOv(); render(); }
};
document.addEventListener('click', function(e){ var b = e.target.closest('[data-act]'); if (!b || b.disabled) return; var h = acts[b.getAttribute('data-act')]; if (h) h(b.getAttribute('data-v'), b); });
document.addEventListener('input', function(e){ if (e.target.id === 'mix'){ var mx = +e.target.getAttribute('data-max'), d = fromStop(+e.target.max - +e.target.value, mx); e.target.setAttribute('aria-valuetext', money(d) + ' card debt'); } });
document.addEventListener('change', function(e){ if (e.target.id === 'mix' && S && S.phase === 'decide' && S.stage === 1){ S.dt = fromStop(+e.target.max - +e.target.value, +e.target.getAttribute('data-max')); save(); render(); } });
render();
window.__LL = { acts: acts, state: function(){ return S; } };
})();
</script>
