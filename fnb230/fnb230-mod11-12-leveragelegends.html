<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leverage Legends</title>
<style>
:root{--bg:#0E1630;--panel:#18233F;--panel2:#22305A;--ink:#FFF6E0;--dim:#B9C2DC;--orange:#FF8A1F;--green:#3DDC84;--red:#FF7B7B;--yellow:#FFD23F;--blue:#6BB6FF;--awn:#E63946;--ac:#4DA3FF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:10px 14px;background:var(--panel2);color:var(--ink);font-weight:700;touch-action:manipulation;min-width:0}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn-go{background:var(--green);color:#06210F}
.btn-ghost{background:transparent;border:2px solid var(--panel2)}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 14px 40px}
.awning{height:22px;background:repeating-linear-gradient(90deg,var(--yellow) 0 28px,var(--awn) 28px 56px);border-radius:0 0 10px 10px;margin:0 -14px 12px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-bottom:10px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--panel2)}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;min-width:0}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.prog{font-size:.85rem;color:var(--dim);white-space:nowrap}
.cash{margin-left:auto;font-weight:800;font-size:1.15rem;color:var(--green)}
.iconbtn{min-width:48px;padding:6px;background:var(--panel)}
.card{background:var(--panel);border-radius:16px;padding:14px;margin:0 0 12px;border-left:6px solid var(--ac)}
.card.plain{border-left:0}
.pill{display:inline-block;background:var(--ac);color:#06122B;font-weight:800;border-radius:999px;padding:3px 12px;font-size:.85rem;margin-bottom:8px}
h1{font-size:2rem;line-height:1.1;margin:.2em 0}
h2{font-size:1.25rem;margin:.1em 0 .3em;line-height:1.2}
h3{font-size:1.02rem;margin:.1em 0 .5em}
p{margin:.35em 0}
h1,h2,h3,p,td,th,.bubble,button{overflow-wrap:break-word}
.dim{color:var(--dim)}
.big{font-size:2rem;font-weight:900;line-height:1.15}
.forecast{background:#0B1228;border-radius:12px;padding:10px 12px;margin-top:8px}
.forecast b{display:block;font-size:1.6rem}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.met{background:#0B1228;border-radius:10px;padding:8px 10px;min-width:0}
.met span{display:block;font-size:.8rem;color:var(--dim)}
.met b{font-size:1.15rem}
.mix{display:flex;align-items:center;gap:14px}
.mix svg{width:104px;height:104px;flex:0 0 104px}
.legend{font-size:.88rem;line-height:1.75;margin:6px 0 0}
.sw{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:6px}
.chart svg{width:100%;height:auto;display:block}
.gauge{background:#0B1228;border-left:4px solid var(--yellow);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.95rem}
.moves{display:grid;gap:8px}
.mv{text-align:left;font-weight:600;border:2px solid transparent;padding:10px 12px}
.mv b{display:block}
.mv small{display:block;font-weight:500;margin-top:2px}
.mv.on{background:var(--orange);color:#231000}
.mango{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.mface{flex:0 0 52px;height:52px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:1.8rem;position:relative}
.mface:before,.mface:after{content:"";position:absolute;top:-6px;border:9px solid transparent;border-bottom:13px solid var(--orange)}
.mface:before{left:2px;transform:rotate(-25deg)}.mface:after{right:2px;transform:rotate(25deg)}
.bubble{background:var(--ink);color:#1B1B2A;border-radius:14px;padding:10px 12px;flex:1;font-weight:600;min-width:0}
.ticker{font-size:3rem;font-weight:900;text-align:center;margin:4px 0}
.up{color:var(--green)}.down{color:var(--red)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.bar{background:#0B1228;border-radius:12px;padding:10px;text-align:center;min-width:0}
.bar .col{height:80px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0}
.bar .fill{width:56px;border-radius:8px 8px 0 0;background:var(--green);min-height:4px;transition:height .8s}
.bar .fill.neg{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--panel2)}
td.r,th.r{text-align:right}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,10,24,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.hold{width:220px;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:22px}
.hold i{display:block;height:100%;background:var(--ink);width:0}
.receipt{background:var(--ink);color:#1B1B2A;border-radius:6px;padding:18px 16px;margin-bottom:12px}
.receipt h2{text-align:center;letter-spacing:2px}
.receipt .line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #9A957F;padding:5px 0}
.receipt .line b{text-align:right}
.receipt .total{font-size:2.2rem;font-weight:900;text-align:center;margin:10px 0 2px}
.receipt th,.receipt td{border-bottom:1px dashed #9A957F}
.receipt .copy{background:#1B1B2A;color:var(--ink);border-radius:8px;padding:10px;text-align:center;font-weight:800;margin-top:12px}
.field{display:block;margin:10px 0}
.field span{display:block;font-weight:700;margin-bottom:4px}
.field input{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--panel2);background:#0B1228;padding:8px 12px;font-size:1.15rem}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hgrid button{display:flex;flex-direction:column;align-items:center;font-size:.85rem;padding:8px 2px}
.hgrid button i{font-style:normal;font-size:1.8rem}
.hgrid button.on{background:var(--orange);color:#231000}
.err{color:var(--yellow);font-weight:700;min-height:1.4em}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:30;pointer-events:none;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.amt{background:#0B1228;border-radius:12px;padding:10px 12px;margin-top:10px}
.amt input[type=range]{width:100%;height:44px;accent-color:var(--orange)}
.amtrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.amtrow button{padding:8px 2px;font-size:.85rem;white-space:nowrap}
.mixbar{display:flex;height:40px;border-radius:10px;overflow:hidden;margin:10px 0 6px;border:2px solid #0B1228}
.mixbar div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#0B1228;white-space:nowrap;overflow:hidden}
.mixleg{display:flex;justify-content:space-between;gap:6px;font-size:.8rem;flex-wrap:wrap}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim);margin:-6px 0 8px}
#mix{width:100%;height:44px;accent-color:#B9C2DC;margin-top:6px}
.mixbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mixbtns button{min-height:44px;padding:6px 4px;font-size:.9rem}
.tipbtn{min-height:44px;min-width:44px;padding:0;background:transparent;color:var(--blue);font-size:1.15rem;vertical-align:middle;margin:-10px 0 -10px 2px}
.tip{background:#0B1228;border-left:4px solid var(--blue);border-radius:8px;padding:8px 10px;margin:4px 0 8px;font-size:.92rem;font-weight:500}
.new{display:inline-block;background:var(--yellow);color:#231000;border-radius:6px;padding:0 6px;font-size:.75rem;font-weight:800;margin-left:6px}
@media(max-width:380px){html,body{font-size:16px}#app{padding:0 10px 32px}.awning{margin:0 -10px 10px}.card{padding:12px}.ticker{font-size:2.5rem}.big{font-size:1.6rem}.receipt{padding:14px 10px}table{font-size:.8rem}.chip .nm{max-width:70px}.mix svg{width:88px;height:88px;flex-basis:88px}}
@media(min-width:900px){html,body{font-size:19px}#app{max-width:720px}.awning{margin:0 0 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>

<script id="core">
/* ======================= CONSTANTS: tune here ======================= */
var CONFIG = {
  REFLECT_SECONDS: 6,          // held screen after the first big swing
  Z90: 1.2816,                 // worst case and best case are the 10th and 90th percentiles: base case -/+ 1.2816 sd
  TIP_NOISE: 0.5,              // Mango's reading = result + noise (sd = this x the round's sd). Her base case moves 80% toward it; her range is 45% as wide
  BIG_SWING: 0.25,             // the pause screen fires the first time a stake falls (or all debt would have fallen) by this share
  S1: {
    START: 500,                // what the business is worth at the start
    RATES: [0.06, 0.09, 0.12], // credit card rate per season on each step of debt; one step = 1x your stake
    PARTNER_RATE: 0.10,        // the partner sizes their share to expect this return, using the same forecast the student has (Mango's, once bought)
    SIZE: 4,                   // each season the business invests this many times your stake
    MIN_MOVE: 50,              // the slider moves in steps of this much
    TIP_PCT: 0.08,             // Mango's tip costs this share of your stake, every season
    SEASONS: [                 // worst case (1 in 10 below) and best case (1 in 10 above); the base case is the middle
      { lo: 0.10, hi: 0.30 }, { lo: 0.00, hi: 0.12 }, { lo: 0.15, hi: 0.40 },
      { lo: -0.40, hi: 0.20 }, { lo: -0.25, hi: 0.25 }, { lo: 0.10, hi: 0.40 }
    ]
  },
  S2: {
    START: 500,                // cash with no Stage 1 result on this device, and the floor for those who have one
    PRICE: 800, COST: 560, APP_FEE: 120,  // Stage 2 dollar amounts are 4 times real ones, so Stage 2 swings outweigh the Stage 1 head start
    RENT: 1200,                // stall rent, one month at a time
    LEASE_RENT: 1080,          // rent per month on a lease
    LEASE_MONTHS: 3,
    LEASE_FROM: 1,             // the lease opens in this month (0 = first month)
    SIT_COST: 360,             // storage owed in a month you close (4 x about $90 for a small NYC unit)
    STOCK: 20, CARD_STOCK: 40, CARD_APR: 0.24,
    CARD_FROM: 4,              // borrowing for extra stock opens in this month (0 = first month)
    TIP_COST: 75,              // Mango's tip, paid from cash
    MONTHS: [                  // worst case and best case buyers (10th and 90th percentiles)
      { lo: 8, hi: 18 }, { lo: 4, hi: 12 }, { lo: 0, hi: 16 }, { lo: 12, hi: 24 }, { lo: 6, hi: 16 }, { lo: 5, hi: 40 }
    ]
  }
};
/* ======================= PURE GAME LOGIC ======================= */
function cents(x){ return Math.round(x * 100 + (x < 0 ? -1e-6 : 1e-6)) / 100; }
function roundCount(stage){ return stage === 2 ? CONFIG.S2.MONTHS.length : CONFIG.S1.SEASONS.length; }

/* ---- randomness: every run draws all six results (and Mango's readings) at the start and saves them ---- */
function rng(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(rand){ var u = 0; while (u === 0) u = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand()); }
function caseOf(R){ var base = (R.lo + R.hi) / 2, sd = (R.hi - R.lo) / (2 * CONFIG.Z90); return { base: base, sd: sd, lo: R.lo, hi: R.hi }; }
/* Mango's tip: the forecast after she sees a noisy reading of the result. Sharper, still not certain. */
function tipCase(R, sig){ var c = caseOf(R), k = CONFIG.TIP_NOISE, w = 1 / (1 + k * k), base = c.base + w * (sig - c.base), sd = c.sd * k / Math.sqrt(1 + k * k); return { base: base, sd: sd, lo: base - CONFIG.Z90 * sd, hi: base + CONFIG.Z90 * sd }; }
function drawRun(stage, rand){
  var L = stage === 1 ? CONFIG.S1.SEASONS : CONFIG.S2.MONTHS;
  return L.map(function(R){ var c = caseOf(R), x = c.base + c.sd * gauss(rand), sig = x + CONFIG.TIP_NOISE * c.sd * gauss(rand);
    return stage === 1 ? { ret: x, sig: sig } : { buyers: Math.max(0, Math.round(x)), sig: sig }; });
}

/* ---- Stage 1: one business, six seasons. State is your stake. ---- */
function s1Interest(D, own){ var R = CONFIG.S1.RATES, t = 0, left = D, k; for (k = 0; k < R.length && left > 1e-9; k++){ var sl = k === R.length - 1 ? left : Math.min(left, own); t += sl * R[k]; left -= sl; } return t; }
function s1NextRate(D, own){ var R = CONFIG.S1.RATES; return R[Math.min(R.length - 1, own > 0 ? Math.floor(D / own + 1e-9) : 0)]; }
function s1DebtMax(own){ return cents((CONFIG.S1.SIZE - 1) * own); }
/* The partner's share of the business after the season, priced off the public base case mu. null = the partner says no. */
function s1PartnerShare(own, D, mu){
  var K = CONFIG.S1.SIZE * own, P = K - own - D; if (P <= 1e-9) return 0;
  var exp = own + P + K * mu - s1Interest(D, own), need = (1 + CONFIG.S1.PARTNER_RATE) * P;
  return exp > need ? need / exp : null;
}
/* One season. a = 'sit' or a debt amount. r = the season's return. */
function s1Season(own, a, r, mu){
  if (a === 'sit') return { stake: own, sit: 1, sp: 0, D: 0, P: 0, int: 0 };
  var K = CONFIG.S1.SIZE * own, D = Math.max(0, Math.min(s1DebtMax(own), a)), P = K - own - D, sp = s1PartnerShare(own, D, mu);
  if (sp === null) return null;
  var int = s1Interest(D, own), end = own + P + K * r - int;
  if (end <= 0) return { stake: 0, broke: 1, owed: cents(-end), sp: sp, D: D, P: P, int: int };
  return { stake: cents((1 - sp) * end), sp: sp, D: D, P: P, int: int };
}
/* Return on your stake for a season return r (unrounded, for charts). -1 = broke. */
function s1StakeReturn(own, D, r, mu){ var K = CONFIG.S1.SIZE * own, P = K - own - D, sp = s1PartnerShare(own, D, mu); if (sp === null) return null; var end = own + P + K * r - s1Interest(D, own); return end <= 0 ? -1 : (1 - sp) * end / own - 1; }
function s1DFL(own, D, m){ var ebit = CONFIG.S1.SIZE * own * m, int = s1Interest(D, own); return ebit > int ? ebit / (ebit - int) : null; }
function s1Actions(own){ var a = ['sit'], k; for (k = 0; k <= CONFIG.S1.SIZE - 1; k++) a.push(k * own); return a; }
/* The taught strategy: best expected stake given what you believe (public forecast, or Mango's tip). Payoffs are straight lines in debt, so the best mix sits on a step edge. */
function s1RuleChoice(own, i, belief){ var m = belief == null ? caseOf(CONFIG.S1.SEASONS[i]).base : belief, mu = m, best = 'sit', bv = own;
  s1Actions(own).forEach(function(a){ var r = s1Season(own, a, m, mu), v = r ? r.stake : -1; if (v > bv + 1e-6){ bv = v; best = a; } }); return best; }
function s1BreakEven(){ var R = CONFIG.S1.RATES; return (R[0] + R[1] + CONFIG.S1.PARTNER_RATE) / CONFIG.S1.SIZE; }
/* Play a whole run with a policy(own, i, draw) -> { a, tip }. Used for the "best strategy" line and for tests. */
function s1Sim(draws, policy){
  var own = CONFIG.S1.START, tips = 0, hist = [];
  for (var i = 0; i < draws.length; i++){
    var mu = caseOf(CONFIG.S1.SEASONS[i]).base, p = policy(own, i, draws[i]);
    if (p.tip){ own = cents(own * (1 - CONFIG.S1.TIP_PCT)); tips++; mu = tipCase(CONFIG.S1.SEASONS[i], draws[i].sig).base; }
    var a = p.a === 'sit' ? 'sit' : Math.min(p.a, s1DebtMax(own)), r = s1Season(own, a, draws[i].ret, mu);
    if (!r) r = s1Season(own, s1DebtMax(own), draws[i].ret, mu);
    hist.push({ a: a, ret: draws[i].ret, before: own, after: r.stake, broke: r.broke });
    own = r.stake; if (r.broke) return { stake: 0, broke: i + 1, tips: tips, hist: hist };
  }
  return { stake: own, tips: tips, hist: hist };
}
var S1P = {
  rule: function(own, i){ return { a: s1RuleChoice(own, i) }; },
  hindsight: function(own, i, d){ var mu = caseOf(CONFIG.S1.SEASONS[i]).base, best = 'sit', bv = own; s1Actions(own).forEach(function(a){ var r = s1Season(own, a, d.ret, mu); if (r && r.stake > bv){ bv = r.stake; best = a; } }); return { a: best }; },
  tipAlways: function(own, i, d){ var o = own * (1 - CONFIG.S1.TIP_PCT), play = s1RuleChoice(o, i, tipCase(CONFIG.S1.SEASONS[i], d.sig).base) !== 'sit'; return { a: play ? 2 * o : 'sit', tip: 1 }; }, /* the student follows Mango's play-or-sit advice with the taught mix */
  tipUnclear: function(own, i, d){ var c = caseOf(CONFIG.S1.SEASONS[i]); return Math.abs(c.base - s1BreakEven()) < c.sd ? S1P.tipAlways(own, i, d) : S1P.rule(own, i); },
  allDebt: function(own){ return { a: s1DebtMax(own) }; },
  allPartner: function(){ return { a: 0 }; },
  sitAll: function(){ return { a: 'sit' }; },
  twoStepsAlways: function(own){ return { a: 2 * own }; }
};

/* ---- Stage 2: one shop, six months. State = { cash, lease: months left on a lease } ---- */
function s2CardCost(){ var c = CONFIG.S2; return cents(c.CARD_APR / 12 * (c.CARD_STOCK - c.STOCK) * c.COST); }
function s2Margins(){ var c = CONFIG.S2; return { app: c.PRICE - c.COST - c.APP_FEE, stall: c.PRICE - c.COST }; }
/* way: 'app' | 'stall' (this month only) | 'lease' (sign one, sell at the stall) | 'leased' (stall, lease running) | 'sit' (closed) */
function s2Options(lease, i){ var c = CONFIG.S2; if (lease > 0) return ['leased', 'sit']; var o = ['app', 'stall']; if (i >= c.LEASE_FROM && i + c.LEASE_MONTHS <= c.MONTHS.length) o.push('lease'); o.push('sit'); return o; }
function s2Rent(lease, way){ return lease > 0 || way === 'lease' || way === 'leased' ? CONFIG.S2.LEASE_RENT : CONFIG.S2.RENT; }
/* Profit at a buyer count for a way of selling with a given rent (charts and gauges) */
function s2ProfitAt(buyers, sell, rent, card){
  var c = CONFIG.S2, m = s2Margins(), sales = Math.min(buyers, card ? c.CARD_STOCK : c.STOCK);
  return (sell === 'app' ? m.app * sales : m.stall * sales - rent) - (card ? s2CardCost() : 0);
}
function s2Profit(b, way, lease, card){
  var c = CONFIG.S2;
  if (way === 'sit') return -c.SIT_COST - (lease > 0 ? c.LEASE_RENT : 0);
  return s2ProfitAt(b, way === 'app' ? 'app' : 'stall', s2Rent(lease, way), !!card);
}
function s2NextLease(way, lease){ return way === 'lease' ? CONFIG.S2.LEASE_MONTHS - 1 : Math.max(0, lease - 1); }
function s2DOL(buyers, sell, rent, card){
  var m = s2Margins(), c = CONFIG.S2, sales = Math.min(buyers, card ? c.CARD_STOCK : c.STOCK), cm = (sell === 'app' ? m.app : m.stall) * sales, ebit = cm - (sell === 'app' ? 0 : rent), ebt = ebit - (card ? s2CardCost() : 0);
  return { dol: ebit > 0 ? cm / ebit : null, dtl: ebt > 0 ? cm / ebt : null };
}
/* Chance of each whole number of buyers under a forecast (normal, rounded, never below 0) */
function phi(z){ var t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2), p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
function s2Dist(f){ var out = [], k, hi = Math.ceil(f.base + 6 * f.sd); for (k = 0; k <= Math.max(hi, 0); k++){ var p = k === 0 ? phi((0.5 - f.base) / f.sd) : phi((k + 0.5 - f.base) / f.sd) - phi((k - 0.5 - f.base) / f.sd); if (p > 1e-9) out.push([k, p]); } return out; }
function s2Expect(f, way, lease, card){ return s2Dist(f).reduce(function(a, kp){ return a + kp[1] * s2Profit(kp[0], way, lease, card); }, 0); }
/* Best plan for the rest of the game; value(i, way, lease, card) scores one month */
function s2Search(i, lease, value, memo){
  var n = CONFIG.S2.MONTHS.length; if (i === n) return { v: 0, path: [] };
  memo = memo || {}; var key = i + ':' + lease; if (memo[key]) return memo[key];
  var best = null;
  s2Options(lease, i).forEach(function(w){ (i >= CONFIG.S2.CARD_FROM && w !== 'sit' ? [false, true] : [false]).forEach(function(cd){
    var now = value(i, w, lease, cd), rest = s2Search(i + 1, s2NextLease(w, lease), value, memo), v = now + rest.v;
    if (!best || v > best.v + 1e-6) best = { v: v, path: [w + (cd ? '+card' : '')].concat(rest.path) };
  }); });
  return (memo[key] = best);
}
function s2Forecast(i){ return caseOf(CONFIG.S2.MONTHS[i]); }
var s2EC = {};

    best = '<b>Best strategy:</b> borrow only while debt costs less than the partner\'s ' + p0(CONFIG.S1.PARTNER_RATE) + '. Sit out seasons that look weak.<br>In your seasons, that would have made <b>' + money(smart) + '</b>.';
    head = '<tr><th>#</th><th>Move</th><th class="r">Return</th><th class="r">Stake</th></tr>';
    rows = S.hist.map(function(e, i){ return '<tr><td>' + (i + 1) + '</td><td>' + e.label + '</td><td class="r num">' + pct(e.ret) + '</td><td class="r num">' + (e.failed ? 'broke' : m0(e.after)) + '</td></tr>'; }).join('');
    extra = (S.tipSpent ? L('Mango\'s tips', money(S.tipSpent)) : '') + (st.failed ? L('Went broke in', 'Season ' + st.broke) + L('Still owed on the card', money(st.owed)) : '');
  } else {
    var base = S.base == null ? CONFIG.S2.START : S.base, prof = cents(total - base), safe = s2Sim(S.draws, S2P.appAll, base).profit; smart = s2Sim(S.draws, S2P.rule, base).profit;
    label = labelFor(prof, safe, smart);
    best = '<b>Best strategy:</b> use the stall when you expect more than ' + (CONFIG.S2.RENT / (s2Margins().stall - s2Margins().app)) + ' buyers, the app when you expect fewer.<br>In your months, that would have made <b>' + signed(smart) + '</b>.';
    head = '<tr><th>#</th><th>Sold</th><th class="r">Buyers</th><th class="r">Profit</th></tr>';
    rows = S.hist.map(function(e, i){ return '<tr><td>' + (i + 1) + '</td><td>' + e.label + '</td><td class="r num">' + e.buyers + '</td><td class="r num">' + m0(e.profit) + '</td></tr>'; }).join('');
    extra = L('Started with', money(base)) + (S.tipSpent ? L('Mango\'s tips', money(S.tipSpent)) : '');
  }
  return '<div class="awning"></div><div class="receipt"><h2>' + esc(S.name.toUpperCase()) + '\'S RESALE CO.</h2><p style="text-align:center;margin:-6px 0 8px;font-size:.8rem;letter-spacing:1px">LEVERAGE LEGENDS</p>' + L('Name', H().icon + ' ' + esc(S.name)) + L('Stage', S.stage === 2 ? '2 · Operating leverage' : '1 · Financial leverage') + L('Played', new Date(S.doneAt || Date.now()).toLocaleDateString() + ' · try ' + (S.attempt || 1)) + extra +
    '<p style="color:#555;text-align:center;margin:12px 0 0">' + (S.stage === 1 ? 'YOUR STAKE' : 'YOUR PROFIT') + '</p><div class="total num">' + (S.stage === 1 ? money(total) : signed(cents(total - S.base))) + '</div>' + (S.stage === 1 ? '<p style="text-align:center;margin:0;font-weight:800">' + pct((total - CONFIG.S1.START) / CONFIG.S1.START) + ' on your ' + money(CONFIG.S1.START) + '</p>' : '') + '<p style="text-align:center;font-weight:800;font-size:1.2rem">' + label + '</p>' +
    '<p style="border-top:1px dashed #9A957F;padding-top:8px">' + best + '</p><table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>' +
    '<div class="copy">Take a screenshot of this receipt.</div></div>' +
    mango(label === 'Legend' ? FACE.wow : FACE.smug, label === 'Legend' ? 'Okay. Legend. Do not get loud about it.' : label === 'Played it safe' ? 'Safe. Nothing wrong with that. But safe did not grow your money.' : 'Everyone gets different luck. Compare your choices with a classmate, not your totals.') + (S.stage === 1 ? '<button class="btn-go" data-act="stage2" style="width:100%;margin-bottom:8px">Go on to Stage 2 with ' + money(Math.max(CONFIG.S2.START, total)) + '</button>' : '') + '<button data-act="again" style="width:100%">Play again</button><button class="btn-ghost" data-act="home" style="width:100%;margin-top:8px">Back to the counter</button>';
}

/* ======================= RENDER ======================= */
function render(){
  var html, scr;
  if (!S){ html = startScreen(); scr = 'start'; }
  else if (S.phase === 'intro'){ html = introScreen(); scr = 'intro'; }
  else if (S.phase === 'decide'){ html = header() + (S.stage === 1 ? decide1() : decide2()) + footer(); scr = 'dec' + S.i; }
  else if (S.phase === 'reveal'){ html = header() + (S.stage === 1 ? reveal1() : reveal2()) + '<button class="btn-go" data-act="next" style="width:100%">' + (S.stage === 1 && S.hist[S.i].failed ? 'See what happened' : S.i === N() - 1 ? 'Finish' : (S.stage === 1 ? 'Next season' : 'Next month')) + '</button>' + footer(); scr = 'rev' + S.i; }
  else if (S.phase === 'debrief'){ html = S.stage === 1 ? debrief1() : debrief2(); scr = 'debrief'; }
  else { html = resultsScreen(); scr = 'results'; }
  var fe = document.activeElement, fk = fe && app.contains(fe) ? (fe.id ? '#' + fe.id : fe.getAttribute('data-act') ? '[data-act="' + fe.getAttribute('data-act') + '"]' + (fe.getAttribute('data-v') != null ? '[data-v="' + fe.getAttribute('data-v') + '"]' : '') : null) : null;
  app.innerHTML = html;
  if (fk){ var nf = $(fk); if (nf && !nf.disabled) try { nf.focus({ preventScroll: true }); } catch (e){} }
  if (scr !== ui.scr){ ui.scr = scr; window.scrollTo(0, 0); }
  if (ui.ov && !(S && S.phase === 'reveal')) closeOv();
  if (!S) return;
  if (S.phase === 'reveal'){
    var e = S.hist[S.i], k = 'a' + S.i;
    if (!S.seen[k]){ S.seen[k] = 1; save(); animateReveal(e); } else document.querySelectorAll('.bar .fill').forEach(function(f){ f.style.height = f.getAttribute('data-h') + 'px'; });
    if (e.big && !S.seen.reflect && !ui.ov){ ui.ov = 1; ovTimer = setTimeout(function(){ if (ui.ov && S && S.phase === 'reveal') showReflect(e); }, REDUCED || S.seen.rw ? 50 : 2300); S.seen.rw = 1; save(); }
  }
  if (S.phase === 'results' && !ui.printed){ ui.printed = 1; confetti(); SFX.win(); }
}

/* ======================= ACTIONS ======================= */
function begin(stage, name, hustle){
  var k = 'll4_n' + stage + '_' + name.toLowerCase(), n = (lsGet(k) || 0) + 1; lsSet(k, n);
  var from1 = stage === 2 ? lsGet('ll4_s1_' + name.toLowerCase()) : null, base = stage === 2 ? Math.max(CONFIG.S2.START, from1 || 0) : null;
  var seed = Math.floor(Math.random() * 4294967296);
  S = { v: 4, name: name, hustle: hustle, stage: stage, from1: from1, base: base, i: 0, phase: 'intro', draws: drawRun(stage, rng(seed)), st: stage === 1 ? { own: CONFIG.S1.START, failed: 0 } : { cash: base, lease: 0 }, move: null, sit: false, card: false, hist: [], seen: {}, attempt: n };
  ui.printed = 0; ui.over = 0; save(); render();
}
function hint(t){ var h = $('#hint'); if (h) h.textContent = t; }
var acts = {
  mute: function(){ muted = !muted; lsSet('ll_mute', muted); render(); },
  hustle: function(v){ ui.hustle = v; ui.name = $('#f-name').value; render(); },
  start: function(v){ var n = cleanName($('#f-name').value); ui.name = n; if (!n){ ui.err = 'Type your name first.'; render(); return; } ui.err = ''; begin(+v, n, ui.hustle); },
  go: function(){ S.phase = 'decide'; save(); render(); },
  move: function(v){ if (S.phase !== 'decide' || S.stage !== 2) return; S.move = v; save(); SFX.pick(); render(); },
  sit: function(){ if (S.phase !== 'decide' || S.stage !== 1) return; S.sit = !S.sit; S.picked = 1; save(); SFX.pick(); render(); },
  mango: function(){
    if (S.phase !== 'decide' || tipped(S.i)) return; var cost = tipCost();
    if (S.stage === 1) S.st.own = cents(S.st.own - cost); else { if (S.st.cash < cost * 2) return; S.st.cash = cents(S.st.cash - cost); }
    S.tipped = S.tipped || {}; S.tipped[S.i] = 1; S.tipSpent = cents((S.tipSpent || 0) + cost); save(); SFX.pick(); render();
  },
  tip: function(v){ ui.tips[v] = !ui.tips[v]; render(); },
  card: function(v){ if (S.phase !== 'decide') return; S.card = v === '1'; save(); SFX.pick(); render(); },
  run: function(){
    if (S.phase !== 'decide') return; var i = S.i, e, d = S.draws[i];
    if (S.stage === 1){
      if (!S.picked){ hint('Choose your mix first.'); return; }
      var own = S.st.own, mu = mu1(i), a = S.sit ? 'sit' : s1D(), r = s1Season(own, a, d.ret, mu);
      if (!r){ hint('The partner says no to this mix. Use more debt, or sit out.'); return; }
      var cmpAll = !S.sit && a >= s1DebtMax(own) - 0.005, cmp = s1Season(own, cmpAll ? 0 : s1DebtMax(own), d.ret, mu) || { stake: own };
      e = { ret: d.ret, sat: !!S.sit, D: r.D, sp: r.sp, int: r.int, failed: !!r.broke, owed: r.owed || 0, before: own, after: r.stake, mine: cents(r.stake - own), cmp: cents(cmp.stake - own), cmpLabel: cmpAll ? 'All partner' : 'All debt',
        label: S.sit ? 'Sat out' : (r.D > 0 ? 'Debt ' + m0(r.D) : 'No debt') + (r.P > 0 ? ' · partner ' + m0(r.P) : '') };
      e.big = e.sat ? cmp.stake <= own * (1 - CONFIG.BIG_SWING) : r.stake <= own * (1 - CONFIG.BIG_SWING);
      S.st = r.broke ? { own: 0, failed: 1, broke: i + 1, owed: r.owed } : { own: r.stake, failed: 0 };
    } else {
      var way = S.move, lease = S.st.lease;
      if (!way){ hint('Choose how to sell first.'); return; }
      var cd = i >= CONFIG.S2.CARD_FROM && !!S.card && way !== 'sit', profit = s2Profit(d.buyers, way, lease, cd), sell = way === 'app' ? 'app' : way === 'sit' ? 'sit' : 'stall';
      var alt = sell === 'app' ? s2ProfitAt(d.buyers, 'stall', CONFIG.S2.RENT, cd) : s2Profit(d.buyers, 'app', 0, cd && sell !== 'sit');
      e = { buyers: d.buyers, sell: sell, way: way, card: cd, profit: profit, alt: alt, rent: sell === 'stall' ? s2Rent(lease, way) : sell === 'sit' && lease > 0 ? CONFIG.S2.LEASE_RENT : 0, pre: { cash: S.st.cash, lease: lease }, before: S.st.cash, after: cents(S.st.cash + profit), big: profit < 0,
        label: (sell === 'sit' ? 'Closed' : sell === 'app' ? 'App' : way === 'lease' ? 'Stall, new lease' : way === 'leased' ? 'Stall, lease' : 'Stall') + (cd ? ' + 40 items' : '') };
      S.st = { cash: e.after, lease: s2NextLease(way, lease) };
    }
    S.hist[i] = e; S.phase = 'reveal'; save(); render();
  },
  next: function(){ if (S.phase !== 'reveal') return; if (ui.ov){ if (!ov.innerHTML){ clearTimeout(ovTimer); showReflect(S.hist[S.i]); } return; } closeOv(); if (S.i + 1 < N() && !(S.stage === 1 && S.hist[S.i].failed)){ S.i++; S.phase = 'decide'; S.dt = null; S.sit = false; S.picked = 0; S.move = null; S.card = false; } else S.phase = 'debrief'; save(); render(); },
  closeov: function(){ closeOv(); },
  results: function(){ S.phase = 'results'; S.doneAt = Date.now(); if (S.stage === 1) lsSet('ll4_s1_' + S.name.toLowerCase(), S.st.own); save(); render(); },
  stage2: function(){ begin(2, S.name, S.hustle); },
  again: function(){ begin(S.stage, S.name, S.hustle); },
  home: function(){ ui.name = S.name; ui.hustle = S.hustle; S = null; save(); render(); },
  over: function(){ if (!ui.over){ ui.over = 1; render(); setTimeout(function(){ if (ui.over){ ui.over = 0; if (!ui.ov) render(); } }, 4000); return; } ui.over = 0; if (S){ ui.name = S.name; ui.hustle = S.hustle; } S = null; save(); closeOv(); render(); }
};
document.addEventListener('click', function(e){ var b = e.target.closest('[data-act]'); if (!b || b.disabled) return; var h = acts[b.getAttribute('data-act')]; if (h) h(b.getAttribute('data-v'), b); });
document.addEventListener('input', function(e){ if (e.target.id === 'mix'){ var mx = +e.target.getAttribute('data-max'), d = fromStop(+e.target.max - +e.target.value, mx); e.target.setAttribute('aria-valuetext', money(d) + ' debt, ' + money(mx - d) + ' partner'); } });
document.addEventListener('change', function(e){ if (e.target.id === 'mix' && S && S.phase === 'decide' && S.stage === 1){ S.dt = fromStop(+e.target.max - +e.target.value, +e.target.getAttribute('data-max')); S.sit = false; S.picked = 1; save(); render(); } });
render();
window.__LL = { acts: acts, state: function(){ return S; } };
})();
</script>
