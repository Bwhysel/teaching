<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M&amp;M: Mango's Millions</title>
<style>
:root{--bg:#070C1C;--bg2:#0D1530;--panel:#111A36;--panel2:#1C2850;--line:rgba(255,255,255,.08);--ink:#FFF7E6;--dim:#A9B3CF;--faint:#6F7BA0;--orange:#FF8A1F;--orange2:#FFB347;--green:#3DDC84;--mint:#5EF2B5;--red:#FF6B6B;--yellow:#FFD23F;--blue:#6BB6FF;--cyan:#56E0FF;--alert:#E63946;--r:20px}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(900px 520px at 50% -120px,#1B2A5E 0%,rgba(27,42,94,0) 70%),radial-gradient(600px 400px at 110% 30%,rgba(255,138,31,.07),rgba(255,138,31,0) 70%),var(--bg);background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:14px;min-height:50px;padding:10px 16px;background:linear-gradient(180deg,#22305C,#1A264B);color:var(--ink);font-weight:700;touch-action:manipulation;min-width:0;transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.42;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn-go{background:linear-gradient(135deg,#5EF2B5 0%,#3DDC84 55%,#2BC6A0 100%);color:#04261A;border:0;box-shadow:0 8px 24px -8px rgba(61,220,132,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-go:disabled{box-shadow:none;background:linear-gradient(135deg,#2E4A44,#27403A);color:#9FC9B6}
.btn-ghost{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.14)}
.wide{width:100%}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 16px 48px}
.screen{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* top bar */
.top{position:sticky;top:0;z-index:5;margin:0 -16px 14px;padding:10px 16px 10px;background:rgba(7,12,28,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:10px}
.top .ttl{font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .ttl small{display:block;font-weight:600;font-size:.72rem;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase}
.score{margin-left:auto;font-weight:800;white-space:nowrap;background:rgba(61,220,132,.12);color:var(--mint);border:1px solid rgba(61,220,132,.3);padding:5px 12px;border-radius:999px;font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}
.steps i{height:4px;border-radius:999px;background:rgba(255,255,255,.1)}
.steps i.done{background:linear-gradient(90deg,var(--green),var(--mint))}
.steps i.now{background:linear-gradient(90deg,var(--orange),var(--orange2));box-shadow:0 0 10px rgba(255,138,31,.6)}
/* cards */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 18px 40px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}
h1{font-size:2.3rem;line-height:1.02;margin:.15em 0 .25em;letter-spacing:-.8px}
h2{font-size:1.35rem;margin:.05em 0 .25em;line-height:1.15;letter-spacing:-.3px}
h3{font-size:1.05rem;margin:.05em 0 .45em;letter-spacing:-.1px}
p{margin:.35em 0}
h1,h2,h3,p,td,th,.bubble,button{overflow-wrap:break-word}
.dim{color:var(--dim)}
.small{font-size:.88rem}
.eyebrow{font-size:.72rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 0 4px}
/* company header */
.co{display:flex;gap:12px;align-items:center}
.badge{flex:0 0 52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.78rem;letter-spacing:.5px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 20px -8px var(--c1),inset 0 1px 0 rgba(255,255,255,.3)}
.ask{margin:12px 0 0;padding:10px 12px;border-radius:14px;background:rgba(255,210,63,.07);border:1px solid rgba(255,210,63,.18);font-weight:700}
.ask span{display:block;font-size:.72rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--yellow);font-weight:800;margin-bottom:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.fact{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-width:0}
.fact span{display:block;font-size:.76rem;color:var(--dim)}
.fact b{font-size:1.25rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;column-gap:2px;margin-top:6px}
.meta .gap{width:14px}
.nw{white-space:nowrap;display:inline-flex;align-items:center}
/* Mango */
.mango{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px}
.mface{flex:0 0 50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFB55E,#FF8A1F 60%,#E66F05);display:flex;align-items:center;justify-content:center;font-size:1.75rem;position:relative;box-shadow:0 6px 16px -6px rgba(255,138,31,.7)}
.mface:before,.mface:after{content:"";position:absolute;top:-6px;border:9px solid transparent;border-bottom:13px solid #FF9A33}
.mface:before{left:2px;transform:rotate(-25deg)}.mface:after{right:2px;transform:rotate(25deg)}
.bubble{position:relative;background:#FFF7E6;color:#1A1A2B;border-radius:18px 18px 18px 6px;padding:11px 14px;flex:1;font-weight:600;min-width:0;box-shadow:0 10px 26px -14px rgba(0,0,0,.8)}
.bubble:before{content:"";position:absolute;left:-7px;top:16px;border:8px solid transparent;border-right-color:#FFF7E6;border-left:0}
.bubble ol{margin:6px 0 0;padding-left:20px}
.bubble li{margin:2px 0}
/* chart */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.drawn{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1.1s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hidden-veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hidden-veil span{background:rgba(7,12,28,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1.5px dashed rgba(255,210,63,.8);color:var(--yellow);font-weight:800;padding:9px 16px;border-radius:999px;letter-spacing:.3px}
.caption{font-size:.84rem;color:var(--dim);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* slider */
.slider{margin:16px 2px 4px;position:relative}
.readout{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:22px}
.readout .lbl{display:block;font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);font-weight:800}
.readout b{font-size:1.9rem;font-weight:900;letter-spacing:-.5px;display:inline-block;line-height:1.05}
.readout .v{text-align:right}
.readout .v b{font-size:1.35rem;background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.bump{animation:bump .2s ease-out}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
.track{position:relative;height:48px}
.tipb{position:absolute;top:-24px;left:var(--pos,0%);transform:translateX(-50%);background:var(--orange);color:#231000;font-weight:900;font-size:.8rem;padding:2px 9px;border-radius:999px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 14px -6px rgba(255,138,31,.9);transition:opacity .2s}
.tipb:after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--orange);border-bottom:0}
.untouched .tipb{opacity:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;cursor:pointer;position:relative;z-index:1}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--blue) 0,var(--cyan) var(--fill,0%),rgba(255,255,255,.1) var(--fill,0%));box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:12px;border-radius:999px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFC27A,#FF8A1F 65%);border:4px solid #FFF7E6;box-shadow:0 0 0 6px rgba(255,138,31,.18),0 6px 16px rgba(0,0,0,.55);transition:transform .14s ease,box-shadow .2s ease}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#FF8A1F;border:4px solid #FFF7E6;box-shadow:0 0 0 6px rgba(255,138,31,.18)}
input[type=range]:active::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{transform:scale(1.15);box-shadow:0 0 0 10px rgba(255,138,31,.22),0 6px 16px rgba(0,0,0,.55)}
.untouched input[type=range]::-webkit-slider-thumb{background:radial-gradient(circle at 35% 30%,#5B6A94,#36446E 70%);box-shadow:0 0 0 6px rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.55)}
.untouched input[type=range]::-moz-range-thumb{background:#36446E}
.ticks{display:flex;justify-content:space-between;font-size:.74rem;color:var(--faint);margin-top:-6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
/* news */
.news{position:relative;border-radius:var(--r);overflow:hidden;margin:0 0 14px;background:linear-gradient(180deg,#22101A,#170B12);border:1px solid rgba(230,57,70,.55);box-shadow:0 18px 40px -20px rgba(230,57,70,.5)}
.news .bar{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#E63946,#C81D3A);color:#fff;font-weight:900;letter-spacing:2px;font-size:.8rem;padding:8px 14px;position:relative;overflow:hidden}
.news .bar:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 2.4s ease-in-out .3s 2}
@keyframes sweep{to{transform:translateX(100%)}}
.news .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.15}}
.news .bar i{margin-left:auto;font-style:normal;font-weight:700;letter-spacing:1px;font-size:.7rem;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:999px}
.news .body{padding:14px 16px 12px}
.news h2{font-size:1.5rem;font-weight:900;letter-spacing:-.5px;line-height:1.12}
.news p{color:#F3D8DC}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid rgba(230,57,70,.25);background:rgba(0,0,0,.25);font-size:.8rem;font-weight:700;letter-spacing:.6px;color:#FF9AA5;padding:6px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 18s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.news.flash{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.news.compact .body{padding:10px 14px}
/* results */
.big{font-size:2.6rem;font-weight:900;line-height:1.05;letter-spacing:-1px}
.pos{background:linear-gradient(90deg,var(--mint),var(--green) 60%,#2BC6A0);-webkit-background-clip:text;background-clip:text;color:transparent}
.neg{background:linear-gradient(90deg,#FF9A8B,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.vs{display:flex;gap:8px;margin-top:10px}
.vs div{flex:1;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.vs span{display:block;font-size:.74rem;color:var(--dim)}
.vs span.tag,.vs span.pts{display:inline-block;font-size:.86rem}
.vs span.pts{font-size:1rem;color:var(--mint)}
.vs b{font-size:1.05rem}
.brk{width:100%;border-collapse:collapse;margin-top:12px;font-size:.94rem}
.brk td{padding:8px 4px;border-top:1px solid var(--line)}
.brk td:last-child,.brk th:last-child,.brk td:nth-child(2),.brk th:nth-child(2){text-align:right;white-space:nowrap}
.brk th{font-size:.76rem;color:var(--dim);text-align:left;font-weight:600;padding:4px}
.brk tr.tot td{font-weight:800;border-top:1.5px solid rgba(255,255,255,.3)}
.bar-in{display:block;height:4px;border-radius:999px;margin-top:4px;background:var(--c);width:var(--w)}
.tag{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.86rem;background:var(--panel2);vertical-align:middle}
.tag.good{background:linear-gradient(135deg,var(--mint),var(--green));color:#04261A}.tag.mid{background:linear-gradient(135deg,#FFE27A,var(--yellow));color:#2A2000}.tag.bad{background:linear-gradient(135deg,#FF9A8B,var(--red));color:#2A0606}
.pts{display:inline-block;font-weight:800;color:var(--mint);margin-left:6px;animation:rise .5s .9s both}
/* mcq */
.opts{display:grid;gap:9px;margin-top:8px}
.opt{text-align:left;font-weight:600;background:rgba(255,255,255,.035);border:1.5px solid rgba(255,255,255,.1);padding:12px 14px;line-height:1.35}
.opt[aria-pressed=true]{background:linear-gradient(135deg,rgba(255,138,31,.95),rgba(255,179,71,.95));color:#231000;border-color:transparent;box-shadow:0 8px 20px -10px rgba(255,138,31,.8)}
.opt.right{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.opt.wrong{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.seg .opt{text-align:center;padding:12px 6px}
.qn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);font-size:.85rem;font-weight:900;margin-right:8px}
.tipbtn{min-width:44px;min-height:44px;padding:0;border-radius:50%;background:transparent;border:0;color:var(--blue);font-size:1.1rem;vertical-align:middle}
.tip{display:block;background:rgba(0,0,0,.3);border:1px solid rgba(107,182,255,.25);border-left:3px solid var(--blue);border-radius:12px;padding:9px 12px;margin:6px 0;font-size:.88rem;color:var(--dim);flex-basis:100%}
/* reflection */
.veil{position:fixed;inset:0;background:rgba(3,6,15,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;animation:rise .4s ease-out}
.veil .card{max-width:520px;width:100%;border:1px solid rgba(255,210,63,.45);box-shadow:0 30px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,210,63,.15)}
.ring{height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}
.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));width:0;transition:width linear}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cmp div{border-radius:14px;padding:10px 12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.cmp span{display:block;font-size:.76rem;color:var(--dim)}
.cmp b{font-size:1.25rem}
/* debrief */
.rule{font-size:1.18rem;font-weight:800;line-height:1.35;background:linear-gradient(90deg,#FFF7E6,#FFD9A8);-webkit-background-clip:text;background-clip:text;color:transparent}
.dl{display:grid;gap:8px}
.dl .it{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.dl .it b{color:var(--orange2)}
.dl .hd{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px;font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);font-weight:800}
/* receipt */
.receipt{position:relative;background:#FBF7EC;color:#1B1B2A;border-radius:4px;padding:18px 12px 20px;margin:4px 0 16px;font-variant-numeric:tabular-nums;box-shadow:0 24px 50px -24px rgba(0,0,0,.9)}
.receipt:before,.receipt:after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 6px 0,transparent 6px,#FBF7EC 6.5px) repeat-x;background-size:12px 10px}
.receipt:before{top:-9px;transform:rotate(180deg)}.receipt:after{bottom:-9px}
.receipt h2{text-align:center;margin:0;letter-spacing:1px}
.receipt .line{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #B8B19A;padding:4px 0}
.receipt table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:10px;table-layout:fixed}
.receipt th:first-child{width:28%}.receipt th:last-child{width:12%}
.receipt td{overflow-wrap:anywhere}
.receipt th,.receipt td{padding:5px 3px;border-bottom:1px solid #DDD6C2;text-align:right}
.receipt th:first-child,.receipt td:first-child{text-align:left}
.receipt .total{font-size:2.6rem;font-weight:900;text-align:center;letter-spacing:-1px}
.receipt .tipbtn{color:#1F5FA8}
.receipt .tip{background:#EFE9D8;color:#1B1B2A;border-color:#C9C0A6;border-left-color:#1F5FA8}
.copy{margin-top:12px;text-align:center;font-weight:700}
/* start */
.hero{text-align:center;padding:22px 18px 18px;margin-top:16px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-40% -20% auto;height:260px;background:radial-gradient(circle at 50% 50%,rgba(255,138,31,.28),rgba(255,138,31,0) 65%);pointer-events:none}
.start-cat{width:132px;height:143px;display:block;margin:0 auto;position:relative;filter:drop-shadow(0 14px 22px rgba(255,138,31,.35));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,#FFB347,#FF8A1F);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .q{font-size:1.15rem;font-weight:800;margin:12px 0 6px;line-height:1.3}
.tickers{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.tickers span{font-size:.72rem;font-weight:900;letter-spacing:.8px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim)}
label.nm{display:block;font-weight:700;margin:14px 0 6px;text-align:left}
input.text{width:100%;min-height:50px;border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);padding:8px 14px}
input.text:focus{border-color:var(--orange)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.drawn{stroke-dashoffset:0}}
</style>
</head>

<script>

/* ======================= CONSTANTS (teacher-tunable) ======================= */
var CONFIG = {
  SNAPSHOT: 'November 25, 2026',
  RF: 0.0485,            // 10-year U.S. Treasury, 11/25/2026 (U.S. Treasury daily par yield curve)
  MRP: 0.0441,           // Damodaran implied equity risk premium, Nov 1, 2026
  COST_UP: 0.0057,       // issue investment-grade bonds, $500M+: total direct costs (Lee, Lochhead, Ritter & Zhao 1996, Table 3)
  COST_DOWN: 0.0315,     // seasoned equity offering, $500M+: total direct costs (LLRZ 1996, Table 1)
  // Damodaran synthetic ratings, large non-financial firms, January 2026: [coverage greater than, rating, spread]
  RATINGS: [[-1e9,'D',0.19],[0.2,'C',0.16],[0.65,'CC',0.1261],[0.8,'CCC',0.0885],[1.25,'B-',0.0509],[1.5,'B',0.0321],
            [1.75,'B+',0.0275],[2.0,'BB',0.0184],[2.25,'BB+',0.0138],[2.5,'BBB',0.0111],[3.0,'A-',0.0089],[4.25,'A',0.0078],

function unlever(c){ return c.beta / (1 + (1 - c.T) * c.ND / c.E); }
function rating(cov, mult){ var r = CONFIG.RATINGS[0]; for (var i = 0; i < CONFIG.RATINGS.length; i++){ if (cov > CONFIG.RATINGS[i][0]) r = CONFIG.RATINGS[i]; } return { rating:r[1], spread:r[2] * mult }; }
function wMin(c){ return c.ND < 0 ? CONFIG.W_MIN_CASH : 0; }
// s: {bU, T, EBIT, spreadMult, wmin}
function buildCurve(s){
  var pts = [], n = Math.round((CONFIG.W_MAX - s.wmin) * 100), mult = s.spreadMult || 1;
  for (var i = 0; i <= n; i++){
    var w = Math.round(s.wmin * 100 + i) / 100;
    var bL = s.bU * (1 + (1 - s.T) * w / (1 - w));     // Hamada (Eq. 14.23)
    var ke = CONFIG.RF + bL * (s.MRP || CONFIG.MRP);   // SML (Eq. 14.22)
    var kd, ka, V, rt = 'none', cov = Infinity;
    if (w <= 0){ kd = CONFIG.RF; ka = w * kd * (1 - s.T) + (1 - w) * ke; V = s.EBIT * (1 - s.T) / ka; }
    else {
      kd = CONFIG.RF + 0.004; var seen = {};
      for (var it = 0; it < 200; it++){
        ka = w * kd * (1 - s.T) + (1 - w) * ke; V = s.EBIT * (1 - s.T) / ka;
        cov = s.EBIT / (kd * w * V);
        var r = rating(cov, mult), kdn = CONFIG.RF + r.spread; rt = r.rating;
        if (Math.abs(kdn - kd) < 1e-12) break;
        var key = kdn.toFixed(8);
        if (seen[key]){ kd = Math.max(kd, kdn); ka = w * kd * (1 - s.T) + (1 - w) * ke; V = s.EBIT * (1 - s.T) / ka; cov = s.EBIT / (kd * w * V); rt = rating(cov, mult).rating; break; }
        seen[key] = 1; kd = kdn;
      }
    }
    pts.push({ w:w, bL:bL, ke:ke, kd:kd, ka:ka, V:V, D:w * V, TB:s.T * w * V, rating:rt });
  }
  var v0 = pts[Math.round(-s.wmin * 100)].V;
  pts.forEach(function(p){ p.dV = p.V - v0; p.CRR = p.TB - p.dV; });   // cost of rising rates = TB − (V(w) − V(0))
  pts.wmin = s.wmin;
  return pts;
}
function idx(pts, w){ return Math.max(0, Math.min(pts.length - 1, Math.round((w - pts.wmin) * 100))); }
function at(pts, w){ return pts[idx(pts, w)]; }
function tcost(Dold, Dnew){ var d = Dnew - Dold; return d >= 0 ? d * CONFIG.COST_UP : -d * CONFIG.COST_DOWN; }
function move(pts, wOld, wNew){ var a = at(pts, wOld), b = at(pts, wNew), c = tcost(a.D, b.D); return { from:a, to:b, gain:b.V - a.V, cost:c, net:b.V - a.V - c }; }
function bestMove(pts, wOld){ var best = null; for (var i = 0; i < pts.length; i++){ var m = move(pts, wOld, pts[i].w); if (!best || m.net > best.net + 1e-12) best = m; } return best; }
function worstMove(pts, wOld){ var worst = null; for (var i = 0; i < pts.length; i++){ var m = move(pts, wOld, pts[i].w); if (!worst || m.net < worst.net) worst = m; } return worst; }
function holdBand(pts){ var lo = null, hi = null; for (var i = 0; i < pts.length; i++){ if (bestMove(pts, pts[i].w).net <= 1e-9){ if (lo === null) lo = pts[i].w; hi = pts[i].w; } } return lo === null ? null : [lo, hi]; }
function peak(pts){ return pts.reduce(function(a, p){ return p.V > a.V ? p : a; }); }
function shareOf(m, best){ var scale = Math.max(best.net, CONFIG.SCORE_FLOOR * best.from.V); return Math.max(0, Math.min(1, 1 - (best.net - m.net) / scale)); }

/* Precompute every round once. Deterministic: reloads cannot change results. */
var MODEL = COMPANIES.map(function(c){

  var sh = c.shock, news = { bU:bU * (sh.bUMult || 1), T:sh.T || c.T, EBIT:c.EBIT, spreadMult:sh.spreadMult || 1, MRP:sh.MRP || CONFIG.MRP, wmin:wmin };
  var p0 = buildCurve(base), p1 = buildCurve(news);
  return { c:c, w0:Math.round(c.ND / (c.ND + c.E) * 100) / 100, p0:p0, p1:p1, band0:holdBand(p0), band1:holdBand(p1), news:news };
});

  return '<div class="top"><div class="row"><div class="ttl"><small>Boardroom ' + (S.r + 1) + ' of 5</small>' + esc(MODEL[S.r].c.name) + '</div><span class="score num" aria-label="Score">' + ptsSoFar() + ' pts</span></div><div class="steps" aria-hidden="true">' + steps + '</div></div>';
}
function catSVG(){ return '<svg class="start-cat" viewBox="0 0 120 130" role="img" aria-label="Mango, an orange bodega cat"><defs><radialGradient id="fur" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFB55E"/><stop offset=".6" stop-color="#FF8A1F"/><stop offset="1" stop-color="#E66F05"/></radialGradient></defs><path d="M92 108 C118 104 122 78 108 66" fill="none" stroke="#E8832A" stroke-width="10" stroke-linecap="round"/><ellipse cx="58" cy="100" rx="38" ry="26" fill="url(#fur)"/><circle cx="58" cy="56" r="30" fill="url(#fur)"/><path d="M33 44 L30 16 L52 32 Z" fill="#FF8A1F"/><path d="M83 44 L86 16 L64 32 Z" fill="#FF8A1F"/><path d="M36 38 L35 24 L46 33 Z" fill="#FFC9A3"/><path d="M80 38 L81 24 L70 33 Z" fill="#FFC9A3"/><path d="M42 52 q6 -5 12 0" fill="none" stroke="#1B1B2A" stroke-width="3" stroke-linecap="round"/><path d="M62 52 q6 -5 12 0" fill="none" stroke="#1B1B2A" stroke-width="3" stroke-linecap="round"/><path d="M55 62 h6 l-3 4 z" fill="#E0567A"/><path d="M58 66 q-5 6 -10 3 M58 66 q5 6 10 3" fill="none" stroke="#1B1B2A" stroke-width="2" stroke-linecap="round"/><rect x="34" y="80" width="48" height="8" rx="4" fill="#1FB5A8"/><circle cx="58" cy="92" r="4" fill="#FFD23F"/></svg>'; }

function startScreen(){
  var saved = load();
  return '<div class="card hero">' + catSVG() +
    '<p class="eyebrow" style="margin-top:8px">FNB 230 · Module 13</p>' +
    '<h1><em>M&amp;M:</em> Mango\'s Millions</h1>' +
    '<p class="dim">You\'re a new CFO advisor. Five real companies. Five boardrooms. One question:</p>' +
    '<p class="q">"Can you make our shareholders richer by changing how much we borrow?"</p>' +
    '<p class="dim">Then the news changes. You decide whether to change the plan.</p>' +
    '<div class="tickers" aria-label="Companies">' + COMPANIES.map(function(c){ return '<span>' + c.id + '</span>'; }).join('') + '</div>' +
    '<label class="nm" for="nm">Your name (for your receipt)</label><input id="nm" class="text" autocomplete="name" maxlength="40">' +
    '<p class="small dim" style="margin-top:10px">Numbers are in billions. Data as of ' + CONFIG.SNAPSHOT + '. News stories are made up.</p>' +
    '</div>' + mango('😼', 'Mango knows this stuff. She\'ll explain, but she won\'t make your call.') +
    '<button class="btn-go wide" data-act="start">Go to the first boardroom</button>' +
    (saved && saved.r !== undefined && saved.step !== 'done' ? '<button class="btn-ghost wide" style="margin-top:10px" data-act="resume">Continue where you left off (boardroom ' + (saved.r + 1) + ')</button>' : '') +
    '<p class="small" style="text-align:center;margin-top:16px;color:var(--faint)">© 2026 Brett Whysel · FNB 230</p>';
}

function companyHead(m){
  var c = m.c, bc = BADGE[c.id];
  return '<div class="co"><div class="badge" style="--c1:' + bc[0] + ';--c2:' + bc[1] + '" aria-hidden="true">' + c.id + '</div><div style="min-width:0"><h2 style="margin:0">' + esc(c.name) + '</h2><p class="small dim" style="margin:2px 0 0">' + esc(c.what) + '</p></div></div>';
}
function companyFacts(m){
  var c = m.c, k1 = 'co' + S.r, k2 = 'as' + S.r;
  var pct2 = function(x){ return (x * 100).toFixed(2) + '%'; };
  var btn = function(id){ var open = !!ui.tips[id]; return '<button class="tipbtn" data-act="tip" data-v="' + id + '" aria-expanded="' + open + '" aria-label="' + (open ? 'Hide details' : 'What does this mean?') + '">ⓘ</button>'; };
  var t1 = 'Market value of stock ' + bn(c.E) + '. Net debt (debt minus cash) ' + bn(c.ND) + '. Beta ' + c.beta.toFixed(2) + ' (Yahoo Finance, 5-year monthly). Tax rate from the last full-year 10-K. Operating income (EBIT) ' + bn(c.EBIT) + ' over the last 12 months (' + esc(c.filing) + '). Firm value here comes from the textbook formula, EBIT × (1 − tax rate) ÷ cost of capital. It will not match the stock market\'s value, which also prices in growth.';
  var t2 = 'Data as of ' + CONFIG.SNAPSHOT + '. Treasury rate ' + pct2(CONFIG.RF) + ' (10-year). Market risk premium ' + pct2(CONFIG.MRP) + ' (Damodaran). Lenders\' rates come from Damodaran\'s rating table: the less a company earns compared with its interest, the lower its credit rating and the more it pays. That is why the curve has kinks. Shareholders\' required return rises with debt (levered beta). Transaction costs: ' + pct2(CONFIG.COST_UP) + ' of debt added (issuing bonds) and ' + pct2(CONFIG.COST_DOWN) + ' of debt paid down (issuing stock), from Lee, Lochhead, Ritter and Zhao (1996).';
  return '<div class="facts"><div class="fact"><span>Debt level today</span><b class="num">' + pc(m.w0) + '</b></div><div class="fact"><span>Tax rate</span><b class="num">' + Math.round(c.T * 100) + '%</b></div></div>' +
    '<div class="meta small dim"><span class="nw">Company data' + btn(k1) + '</span><span class="gap"></span><span class="nw">How the model works' + btn(k2) + '</span></div>' +
    (ui.tips[k1] ? '<span class="tip" role="note">' + t1 + '</span>' : '') + (ui.tips[k2] ? '<span class="tip" role="note">' + t2 + '</span>' : '');
}

function sliderBlock(m, w, opts){
  var lo = Math.round(m.p0.wmin * 100), val = Math.round(w * 100), fill = ((val - lo) / (90 - lo) * 100).toFixed(1) + '%';
  var vtxt = opts.showValue ? '<div class="v"><span class="lbl">Firm value</span><b class="num" id="vread">' + bn(at(opts.curve, w).V) + '</b></div>' : '';
  return '<div class="slider' + (S.touched ? '' : ' untouched') + '"><div class="readout"><div><span class="lbl">Debt level</span><b class="num" id="wread">' + val + '%</b></div>' + vtxt + '</div>' +
    '<label class="sr" for="sl">Debt level, percent of firm value</label>' +
    '<div class="track" style="--pos:calc(' + fill + ' + (' + (0.5 - (val - lo) / (90 - lo)).toFixed(3) + ' * 36px))"><span class="tipb num" id="tipb" aria-hidden="true">' + val + '%</span>' +
    '<input id="sl" type="range" min="' + lo + '" max="90" step="1" value="' + val + '" style="--fill:' + fill + '" aria-valuetext="' + val + ' percent debt"></div>' +
    '<div class="ticks"><span>' + lo + '%</span><span>90%</span></div></div>' +
    '<div class="row2"><button class="btn-ghost" data-act="keep">' + opts.keepLabel + '</button><button class="btn-go" data-act="confirm"' + (S.touched ? '' : ' disabled') + '>' + (S.touched ? 'Confirm ' + val + '%' : 'Choose a debt level first') + '</button></div>';
}

function setChart(m, w){ var showNet = S.r >= 2; return chartSVG({ pts:m.p0, wmin:m.p0.wmin, scale:[m.p0], today:m.w0, you:S.touched ? w : null, band:showNet ? m.band0 : null, net:showNet ? m.w0 : null, draw:!S.touched && !ui.drawn, alt:'Firm value curve for ' + m.c.name + ' at each debt level, today\'s level ' + pc(m.w0) }); }
function setScreen(){
  var m = MODEL[S.r], R = ROUNDS[S.r], w = S.w === null ? m.w0 : S.w;
  var guide = S.r === 0 && !S.touched ? mango('😼', 'Three steps, then I step back:<ol><li>Drag the slider to pick a debt level.</li><li>The curve shows firm value at each level. Find the top.</li><li>Moving costs money, so make it worth it. Then confirm.</li></ol>') : '';
  var intro = R.intro && !S.touched ? mango(R.intro.face, R.intro.text) : '';
  var leg = S.r >= 2 ? legend([['#56E0FF', 'Firm value'], ['#FFD23F', 'After transaction costs', true], ['rgba(201,210,238,.5)', 'Do-nothing band']]) : '';
  var html = topBar() + '<div class="card">' + companyHead(m) +
    '<div class="ask"><span>The board asks</span>Can you make our shareholders richer by changing how much we borrow?</div>' + companyFacts(m) + '</div>' +
    guide + intro +
    '<div class="card chart" id="chartbox"><p class="eyebrow">Firm value at every debt level</p>' + setChart(m, w) + leg +
    sliderBlock(m, w, { showValue:true, curve:m.p0, keepLabel:'Keep today\'s ' + pc(m.w0) }) + '</div>';
  ui.drawn = true;
  return html;
}

function countUpHTML(id, value, signed){ return '<span class="num" id="' + id + '" data-to="' + value + '" data-signed="' + (signed ? 1 : 0) + '">' + (REDUCED ? (signed ? bnS(value) : bn(value)) : (signed ? bnS(0) : bn(0))) + '</span>'; }

function newsScreen(){
  var m = MODEL[S.r], R = ROUNDS[S.r], r = S.res[S.r], m1 = move(m.p0, m.w0, r.w1), b1 = bestMove(m.p0, m.w0);
  var lab = labelFor(r.s1, b1, m1);
  return topBar() + '<div class="card"><p class="eyebrow">Your plan · debt at ' + pc(r.w1) + '</p><p class="small dim" style="margin:0">Value created after transaction costs</p><p class="big ' + (m1.net >= -0.05 ? 'pos' : 'neg') + '">' + countUpHTML('cu1', m1.net, true) + '</p>' +
    '<div class="vs"><div><span>Best move</span><b class="num">' + pc(b1.to.w) + ' · ' + bnT(b1.net) + '</b></div><div><span>Result</span><b><span class="tag ' + lab[1] + '">' + lab[0] + '</span><span class="pts">+' + r.p1 + '</span></b></div></div></div>' +
    '<div class="news flash" role="alert"><div class="bar"><span class="dot" aria-hidden="true"></span>BREAKING NEWS<i>Hypothetical</i></div><div class="body"><h2>' + esc(R.news.head) + '</h2><p>' + esc(R.news.body) + '</p></div><div class="ticker" aria-hidden="true"><span>' + esc(R.news.tick) + '</span></div></div>' +
    mango('😼', R.hint) +
    '<p class="small dim">Next: the new curve stays hidden. Set the debt level where you think the new top is.</p>' +
    '<button class="btn-go wide" data-act="tobet">Make your call</button>';
}

function betChart(m, r, w){ return chartSVG({ pts:m.p0, wmin:m.p0.wmin, scale:[m.p0, m.p1], ghost:m.p0, veil:true, today:r.w1, todayLabel:'Your plan', you:S.touched ? w : null, alt:'Old curve shown dashed. The new curve is hidden.' }); }
function betScreen(){
  var m = MODEL[S.r], r = S.res[S.r], w = S.w === null ? r.w1 : S.w;
  return topBar() + '<div class="news compact"><div class="bar"><span class="dot" aria-hidden="true"></span>AFTER THE NEWS<i>Hypothetical</i></div><div class="body"><p style="margin:0"><b>' + esc(ROUNDS[S.r].news.head) + '.</b> ' + esc(ROUNDS[S.r].news.body) + '</p></div></div>' +
    '<div class="card chart" id="chartbox"><p class="eyebrow">Your call</p><h3>Where is the new best debt level?</h3>' +
    '<div style="position:relative">' + betChart(m, r, w) + '<div class="hidden-veil"><span>New curve hidden</span></div></div>' +
    legend([['#7D8BB5', 'Curve before the news', true]]) +
    sliderBlock(m, w, { showValue:false, keepLabel:'Keep my ' + pc(r.w1) }) + '</div>';
}

function labelFor(share, best, m){
  if (best.to.w === best.from.w && Math.abs(m.to.w - m.from.w) <= CONFIG.HOLD_TOL && share >= 0.9) return ['Right to hold', 'good'];
  for (var i = 0; i < CONFIG.LABELS.length; i++) if (share >= CONFIG.LABELS[i][0]) return [CONFIG.LABELS[i][1], CONFIG.LABELS[i][2]];
}

function revealScreen(){
  var m = MODEL[S.r], R = ROUNDS[S.r], r = S.res[S.r], mv = move(m.p1, r.w1, r.w2), best = bestMove(m.p1, r.w1), pk = peak(m.p1);
  var lab = labelFor(r.s2, best, mv);
  var wrongWay = (pk.w - r.w1) * (r.w2 - r.w1) < 0 && Math.abs(pk.w - r.w1) > 0.02;
  var face = r.s2 >= 0.9 ? '😸' : '😼';
  var line = r.s2 >= 0.9 ? 'Nice. You read that like a bond trader.' : wrongWay ? 'Ehh, you went one way and the curve went the other. Happens to Wall Street guys every day.' : 'Not bad. The market was a little ahead of you.';
  var brk = '';
  if (S.r >= 1){
    var a = mv.from, b = mv.to, bb = best.to;
    var row = function(lbl, you, bst){ return '<tr><td>' + lbl + '</td><td class="num ' + (you > 0.049 ? 'pos' : you < -0.049 ? 'neg' : '') + '">' + bnT(you) + '</td><td class="num">' + bnT(bst) + '</td></tr>'; };
    brk = '<table class="brk"><thead><tr><th>Effect on firm value, from your plan (' + pc(r.w1) + ')</th><th>You (' + pc(r.w2) + ')</th><th>Best (' + pc(bb.w) + ')</th></tr></thead><tbody>' +
      row('Tax benefit ' + tip('tb' + S.r, 'Tax rate × debt. Interest is tax-deductible, so debt saves taxes (textbook Eq. 14.21).'), b.TB - a.TB, bb.TB - a.TB) +
      row('Cost of rising rates ' + tip('cr' + S.r, 'As debt grows, lenders charge more and shareholders demand a higher return. This is the value that rising rates take back (the trade-off model).'), -(b.CRR - a.CRR), -(bb.CRR - a.CRR)) +
      row('Transaction costs', -mv.cost, -best.cost) +
      '<tr class="tot"><td>Value created</td><td class="num">' + bnT(mv.net) + '</td><td class="num">' + bnT(best.net) + '</td></tr></tbody></table><p class="small dim">$B = billions of dollars.</p>';
  }
  var unlock = R.unlock ? mango('😼', R.unlock) : '';
  var flat = '';
  var leg = [['#56E0FF', 'After the news'], ['#7D8BB5', 'Before', true]]; if (S.r >= 2){ leg.push(['#FFD23F', 'After transaction costs', true]); leg.push(['rgba(201,210,238,.5)', 'Do-nothing band']); }
  return topBar() + '<div class="card chart" id="chartbox"><p class="eyebrow">The reveal</p><h3>The new curve</h3>' +
    chartSVG({ pts:m.p1, wmin:m.p1.wmin, scale:[m.p0, m.p1], ghost:m.p0, today:r.w1, todayLabel:'Plan', you:r.w2, best:best.to.w, band:S.r >= 2 ? m.band1 : null, net:S.r >= 2 ? r.w1 : null, alt:'New firm value curve. Best debt level ' + pc(best.to.w) + '. Your call ' + pc(r.w2) + '.' }) +
    legend(leg) + '<p class="caption">Top of the new curve: <b>' + pc(pk.w) + '</b>.</p></div>' +
    '<div class="card"><p class="eyebrow">Your call created</p><p class="big ' + (mv.net >= -0.05 ? 'pos' : 'neg') + '">' + countUpHTML('cu2', mv.net, true) + '</p>' +
    '<div class="vs"><div><span>Best from your plan</span><b class="num">' + pc(best.to.w) + ' · ' + bnT(best.net) + '</b></div><div><span>Result</span><b><span class="tag ' + lab[1] + '">' + lab[0] + '</span><span class="pts">+' + r.p2 + '</span></b></div></div>' + brk + flat + '</div>' +
    mango(face, line) + unlock +
    '<button class="btn-go wide" data-act="toexplain">Explain what happened</button>';
}

function readRight(i){ var m = MODEL[i], r = S.res[i], best = bestMove(m.p1, r.w1), db = best.to.w - r.w1, dy = r.w2 - r.w1; return Math.abs(db) < 0.005 ? Math.abs(dy) <= CONFIG.HOLD_TOL : db * dy > 0; }
function explainScreen(){
  var R = ROUNDS[S.r], r = S.res[S.r], done = r.p3 !== undefined;
  var t2 = r.order.map(function(i){ var o = R.tier2[i], on = r.t2 === i; var cls = done ? (o[1] ? ' right' : on ? ' wrong' : '') : ''; return '<button class="opt' + cls + '" data-act="t2" data-v="' + i + '" aria-pressed="' + on + '"' + (done ? ' disabled' : '') + '>' + esc(o[0]) + '</button>'; }).join('');
  var fb = '';
  if (done){
    var read = readRight(S.r), ok = R.tier2[r.t2][1];
    var msg = ok && read ? 'Right call, right reason. That\'s the whole idea, in one round.' : ok ? 'Right reason. Your slider just didn\'t follow it all the way. Trust the reason next time.' : read ? 'Your slider moved the right way, but the reason is off. Here\'s the real one: ' + esc(R.why) : 'The market fooled you on that one. Here\'s what happened: ' + esc(R.why);
    fb = mango(ok ? '😸' : '😼', msg + ' <b>+' + r.p3 + ' pts</b>') +
      '<button class="btn-go wide" data-act="next">' + (S.r < 4 ? 'Next boardroom' : 'See the debrief') + '</button>';
  }
  return topBar() + '<div class="card"><p class="eyebrow">Explain it</p><h3>Why did the best debt level change the way it did?</h3><div class="opts" role="group" aria-label="Reason">' + t2 + '</div></div>' +
    (done ? fb : '<button class="btn-go wide" data-act="submit"' + (r.t2 !== undefined ? '' : ' disabled') + '>' + (r.t2 !== undefined ? 'Lock in my answer' : 'Pick one answer') + '</button>');
}

function totals(){
  var you = 0, safe = 0;
  S.res.forEach(function(r, i){
    you += (r.p1 || 0) + (r.p2 || 0) + (r.p3 || 0);
    var m = MODEL[i], b1 = bestMove(m.p0, m.w0), s1 = move(m.p0, m.w0, m.w0), b2 = bestMove(m.p1, m.w0), s2 = move(m.p1, m.w0, m.w0);
    safe += Math.round(CONFIG.PTS_STEP1 * shareOf(s1, b1)) + Math.round(CONFIG.PTS_BET * shareOf(s2, b2));
  });
  return { you:you, max:5 * (CONFIG.PTS_STEP1 + CONFIG.PTS_BET + CONFIG.PTS_WHY), safe:safe };
}

function debriefScreen(){
  var rows = [['Added debt and saved taxes', 'Tax benefit of debt (MM with taxes)'],
              ['Watched lenders and shareholders charge more as debt grew', 'Trade-off model of capital structure'],
              ['Saw shareholders\' required return climb with debt', 'Levered beta (Hamada equation)'],
              ['Found the top of the curve', 'Optimal capital structure'],
              ['Stayed put when moving cost more than it gained', 'Transaction costs'],
              ['Chose each company\'s mix of debt and stock', 'Capital structure']];
  return '<div class="card" style="margin-top:16px"><p class="eyebrow">The rule</p><p class="rule">Add debt while the tax benefit is worth more than the rising cost of risk, and only move when the gain is bigger than the cost of moving.</p></div>' +
    '<div class="card"><div class="dl"><div class="hd"><span>What you did</span><span>What it\'s called</span></div>' + rows.map(function(x){ return '<div class="it"><span>' + x[0] + '</span><b>' + x[1] + '</b></div>'; }).join('') + '</div></div>' +
    mango('😸', 'Those other M&amp;M? Modigliani and Miller. Two economists who won Nobel Prizes for the idea you just played. With no taxes and no risk of going broke, the curve would be flat. No debt level would beat another.') +
    mango('😼', 'One more thing. Real CFOs borrow less than this model says. They keep room for bad years and guard their credit rating.') +
    '<button class="btn-go wide" data-act="results">See my receipt</button>';
}

function resultsScreen(){
  var t = totals(), pct = Math.round(t.you / t.max * 100), label = CONFIG.FINAL.filter(function(f){ return pct >= f[0]; })[0][1];
  var rows = S.res.map(function(r, i){ var m = MODEL[i], b = bestMove(m.p1, r.w1), mv = move(m.p1, r.w1, r.w2); return '<tr><td>' + esc(m.c.name.replace(' (Spectrum)', '').replace(' Air Lines', '')) + '</td><td>' + Math.round(r.w1 * 100) + '→' + Math.round(r.w2 * 100) + '</td><td>' + bnR(mv.net) + '</td><td>' + bnR(b.net) + '</td><td>' + ((r.p1 || 0) + (r.p2 || 0) + (r.p3 || 0)) + '</td></tr>'; }).join('');
  var L = function(a, b){ return '<div class="line"><span>' + a + '</span><b>' + b + '</b></div>'; };
  return '<div class="receipt" style="margin-top:22px"><h2>M&amp;M: MANGO\'S MILLIONS</h2><p style="text-align:center;margin:2px 0 10px;font-size:.78rem;letter-spacing:1.5px">FNB 230 · MODULE 13</p>' +
    L('Name', esc(S.name || '—')) + L('Played', new Date(S.doneAt || Date.now()).toLocaleDateString()) +
    '<p style="color:#555;text-align:center;margin:14px 0 0;letter-spacing:1.5px;font-size:.8rem">SCORE</p><div class="total">' + t.you + ' / ' + t.max + '</div><p style="text-align:center;margin:0;font-weight:800">' + pct + '% · ' + label + '</p>' +
    '<table><thead><tr><th>Company</th><th>Debt %</th><th>Your call</th><th>Best</th><th>Pts</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="small" style="margin-top:10px">Best possible score: ' + t.max + '. Staying put every time and answering every question right: ' + (t.safe + 5 * CONFIG.PTS_WHY) + '. Worst possible: 0.</p>' +
    '<div class="copy">Take a screenshot of this receipt.' + tip('shot', '<b>iPhone:</b> press the side button and volume up together. Older iPhones with a Home button: side or top button and Home.<br><b>Android:</b> press power and volume down together.<br><b>Windows:</b> press Windows + Shift + S, then drag over the receipt.<br><b>Mac:</b> press Shift + Command + 4, then drag over the receipt.<br><b>Chromebook:</b> press Ctrl + Show windows.') + '</div></div>' +
    mango(pct >= 85 ? '😸' : '😼', pct >= 85 ? 'Okay, the board loves you. Don\'t let it go to your head.' : pct >= 65 ? 'Solid. Most boards would keep you.' : 'The curve moves fast. Play again and watch where the top goes.') +
    '<button class="wide" data-act="again">Play again</button>';
}

function reflectVeil(){
  var m = MODEL[S.r], cur = at(m.p1, m.w0), best = bestMove(m.p1, m.w0);
  return '<div class="veil" role="dialog" aria-modal="true" aria-labelledby="rf"><div class="card"><p class="eyebrow" style="color:var(--yellow)">A moment</p><h2 id="rf">Sit with this one</h2>' +
    '<div class="cmp"><div><span>Charter at ' + pc(m.w0) + ' debt (today)</span><b class="num neg">' + bn(cur.V) + '</b></div><div><span>Charter at ' + pc(best.to.w) + ' debt</span><b class="num pos">' + bn(best.to.V) + '</b></div></div>' +
    '<p>Getting there means issuing a lot of new stock. The transaction costs alone: <b>' + bn(best.cost) + '</b>.</p>' +
    mango('😼', 'That\'s what too much debt costs. And getting out isn\'t free.') +
    '<div class="ring" aria-hidden="true"><i id="ring"></i></div>' +
    '<button class="btn-go wide" data-act="reflectdone"' + (ui.reflectReady ? '' : ' disabled') + '>' + (ui.reflectReady ? 'Continue' : 'Take a moment…') + '</button></div></div>';
}

/* ======================= RENDER ======================= */
function render(focusSel){
  var html;
  if (!S || S.step === 'start') html = startScreen();
  else if (S.step === 'set') html = setScreen();
  else if (S.step === 'news') html = newsScreen();
  else if (S.step === 'bet') html = betScreen();
  else if (S.step === 'reveal') html = revealScreen() + (ui.reflectOpen ? reflectVeil() : '');
  else if (S.step === 'explain') html = explainScreen();
  else if (S.step === 'debrief') html = debriefScreen();
  else html = resultsScreen();
  var key = (S ? S.step + S.r : 'start'), fresh = key !== ui.lastKey; ui.lastKey = key;
  document.getElementById('app').innerHTML = '<div class="' + (fresh ? 'screen' : '') + '">' + html + '</div>';
  bindSlider();
  runCounters();
  if (focusSel){ var el = document.querySelector(focusSel); if (el) el.focus({ preventScroll:true }); }
}
function go(step){ S.step = step; S.w = null; S.touched = false; ui.tips = {}; save(); render('h2,h3'); window.scrollTo(0, 0); var h = document.querySelector('#app h2, #app h3'); if (h){ h.setAttribute('tabindex', '-1'); h.focus({ preventScroll:true }); } }

function runCounters(){
  document.querySelectorAll('[data-to]').forEach(function(el){
    var to = +el.getAttribute('data-to'), signed = el.getAttribute('data-signed') === '1', fmt = signed ? bnS : bn;
    var key = S ? S.step + S.r + el.id : el.id; ui.counted = ui.counted || {};
    if (REDUCED || ui.counted[key]){ el.textContent = fmt(to); return; }
    ui.counted[key] = 1;
    var t0 = null, dur = 1300;
    function step(ts){ if (!t0) t0 = ts; var k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e); if (k < 1) requestAnimationFrame(step); else el.textContent = fmt(to); }
    requestAnimationFrame(step);
  });
  var curve = document.getElementById('curve');
  if (curve && S && S.step === 'reveal' && !REDUCED && !ui.morphed){
    ui.morphed = true; var m = MODEL[S.r], dNew = curve.getAttribute('d');
    var svgTmp = chartSVG({ pts:m.p0, wmin:m.p0.wmin, scale:[m.p0, m.p1] }), dOld = (svgTmp.match(/id="curve"[^>]* d="([^"]+)"/) || [])[1], area = document.getElementById('area'), tail = area ? area.getAttribute('data-tail') : '';
    if (dOld){
      var A = dOld.match(/-?[\d.]+/g).map(Number), B = dNew.match(/-?[\d.]+/g).map(Number), t0 = null;
      if (A.length === B.length){
        function mstep(ts){ if (!t0) t0 = ts; var k = Math.min(1, (ts - t0) / 900), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, d = ''; for (var i = 0; i < A.length; i += 2){ d += (i ? 'L' : 'M') + (A[i] + (B[i] - A[i]) * e).toFixed(1) + ' ' + (A[i + 1] + (B[i + 1] - A[i + 1]) * e).toFixed(1); } curve.setAttribute('d', d); if (area) area.setAttribute('d', d + tail); if (k < 1) requestAnimationFrame(mstep); }
        requestAnimationFrame(mstep);
      }
    }
  }
}

/* Live slider updates without a full re-render, so keyboard focus stays on the slider. */
function bindSlider(){
  var sl = document.getElementById('sl'); if (!sl) return;
  var onInput = function(){
    var v = +sl.value, w = v / 100, m = MODEL[S.r], first = !S.touched;
    S.w = w; S.touched = true;
    if (first){ render('#sl'); return; }
    var lo = +sl.min; sl.style.setProperty('--fill', ((v - lo) / (90 - lo) * 100).toFixed(1) + '%'); sl.setAttribute('aria-valuetext', v + ' percent debt');
    var wr = document.getElementById('wread'); if (wr){ wr.textContent = v + '%'; wr.classList.remove('bump'); void wr.offsetWidth; wr.classList.add('bump'); }
    var vr = document.getElementById('vread'); if (vr) vr.textContent = bn(at(m.p0, w).V);
    var btn = document.querySelector('[data-act=confirm]'); if (btn){ btn.disabled = false; btn.textContent = 'Confirm ' + v + '%'; }
    var frac = (v - lo) / (90 - lo), trk = sl.parentNode; trk.style.setProperty('--pos', 'calc(' + (frac * 100).toFixed(1) + '% + (' + (0.5 - frac).toFixed(3) + ' * 36px))');
    var tb = document.getElementById('tipb'); if (tb) tb.textContent = v + '%';
    var box = document.querySelector('#chartbox svg');
    if (box){ var tmp = document.createElement('div'); tmp.innerHTML = S.step === 'set' ? setChart(m, w) : betChart(m, S.res[S.r], w); box.replaceWith(tmp.firstChild); }
    if (navigator.vibrate && v % 10 === 0) try { navigator.vibrate(4); } catch (e) {}
  };
  sl.addEventListener('input', onInput);
}

/* ======================= ACTIONS ======================= */
function shuffle(n, seed){ var a = []; for (var i = 0; i < n; i++) a.push(i); var s = seed; for (var j = n - 1; j > 0; j--){ s = (s * 9301 + 49297) % 233280; var k = Math.floor(s / 233280 * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; }
var busy = false;
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  if (busy && act !== 'tip') return;
  if (act === 'tip'){ ui.tips[v] = !ui.tips[v]; var y = window.scrollY; render('[data-act=tip][data-v="' + v + '"]'); window.scrollTo(0, y); return; }
  if (act === 'start'){ var nm = (document.getElementById('nm') || {}).value || ''; newGame(nm.trim()); go('set'); return; }
  if (act === 'resume'){ S = load(); ui = { tips:{}, picked:null }; render(); return; }
  if (act === 'again'){ clearSave(); S = null; ui = { tips:{} }; render(); window.scrollTo(0, 0); return; }
  var m = MODEL[S.r];
  if (act === 'keep'){ S.w = S.step === 'set' ? m.w0 : S.res[S.r].w1; S.touched = true; save(); render('[data-act=confirm]'); return; }
  if (act === 'confirm'){
    if (!S.touched) return;
    busy = true; setTimeout(function(){ busy = false; }, 350);
    if (S.step === 'set'){
      var w1 = S.w === null ? m.w0 : S.w, m1 = move(m.p0, m.w0, w1), b1 = bestMove(m.p0, m.w0), s1 = shareOf(m1, b1);
      S.res[S.r] = { w1:w1, s1:s1, p1:Math.round(CONFIG.PTS_STEP1 * s1), order:shuffle(4, 7 + S.r * 13 + (S.started % 97)) };
      go('news');
    } else if (S.step === 'bet'){
      var r = S.res[S.r], w2 = S.w === null ? r.w1 : S.w, mv = move(m.p1, r.w1, w2), bb = bestMove(m.p1, r.w1), s2 = shareOf(mv, bb);
      r.w2 = w2; r.s2 = s2; r.p2 = Math.round(CONFIG.PTS_BET * s2); ui.morphed = false;
      go('reveal');
    }
    return;
  }
  if (act === 'tobet'){ go('bet'); return; }
  if (act === 'toexplain'){
    if (ROUNDS[S.r].reflect && !S.res[S.r].reflected){ openReflect(); return; }
    go('explain'); return;
  }
  if (act === 'reflectdone'){ S.res[S.r].reflected = true; ui.reflectOpen = false; save(); go('explain'); return; }
  if (act === 't2'){ S.res[S.r].t2 = +v; save(); render('[data-act=t2][data-v="' + v + '"]'); return; }
  if (act === 'submit'){
    var rr = S.res[S.r], R = ROUNDS[S.r]; if (rr.p3 !== undefined || rr.t2 === undefined) return;
    rr.p3 = R.tier2[rr.t2][1] ? CONFIG.PTS_WHY : 0; save(); render('[data-act=next]'); return;
  }
  if (act === 'next'){ busy = true; setTimeout(function(){ busy = false; }, 350); if (S.r < 4){ S.r++; go('set'); } else { S.doneAt = Date.now(); go('debrief'); } return; }
  if (act === 'results'){ S.step = 'done'; save(); render(); window.scrollTo(0, 0); return; }
});
function openReflect(){
  ui.reflectOpen = true; ui.reflectReady = false; render('#rf');
  var ring = document.getElementById('ring'); if (ring){ ring.style.transitionDuration = CONFIG.REFLECT_MS + 'ms'; requestAnimationFrame(function(){ requestAnimationFrame(function(){ ring.style.width = '100%'; }); }); }
  setTimeout(function(){ ui.reflectReady = true; if (ui.reflectOpen){ var y = window.scrollY; render('[data-act=reflectdone]'); window.scrollTo(0, y); var rg = document.getElementById('ring'); if (rg){ rg.style.transitionDuration = '0ms'; rg.style.width = '100%'; } } }, CONFIG.REFLECT_MS);
}
document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target.id === 'nm'){ var b = document.querySelector('[data-act=start]'); if (b) b.click(); } });

/* Resume mid-game on reload; otherwise start page. */
(function(){ var s = load(); if (s && s.step && s.step !== 'start' && s.step !== 'done'){ S = null; } render(); })();

/* Test hook (no effect on play) */
window.__MM = { CONFIG:CONFIG, MODEL:MODEL, move:move, bestMove:bestMove, worstMove:worstMove, shareOf:shareOf, peak:peak, holdBand:holdBand, state:function(){ return S; } };
</script>
