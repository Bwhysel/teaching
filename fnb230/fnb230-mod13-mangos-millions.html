<style>
:root{--bg:#070C1C;--bg2:#0D1530;--panel:#111A36;--panel2:#1C2850;--line:rgba(255,255,255,.08);--ink:#FFF7E6;--dim:#A9B3CF;--faint:#6F7BA0;--orange:#FF8A1F;--orange2:#FFB347;--green:#3DDC84;--mint:#5EF2B5;--red:#FF6B6B;--yellow:#FFD23F;--blue:#6BB6FF;--cyan:#56E0FF;--alert:#E63946;--r:20px}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(900px 520px at 50% -120px,#1B2A5E 0%,rgba(27,42,94,0) 70%),radial-gradient(600px 400px at 110% 30%,rgba(255,138,31,.07),rgba(255,138,31,0) 70%),var(--bg);background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:14px;min-height:50px;padding:10px 16px;background:linear-gradient(180deg,#22305C,#1A264B);color:var(--ink);font-weight:700;touch-action:manipulation;min-width:0;transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.42;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn-go{background:linear-gradient(135deg,#5EF2B5 0%,#3DDC84 55%,#2BC6A0 100%);color:#04261A;border:0;box-shadow:0 8px 24px -8px rgba(61,220,132,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-go:disabled{box-shadow:none;background:linear-gradient(135deg,#2E4A44,#27403A);color:#9FC9B6}
.btn-ghost{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.14)}
.wide{width:100%}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 16px 48px}
.screen{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* top bar */
.top{position:sticky;top:0;z-index:5;margin:0 -16px 14px;padding:10px 16px 10px;background:rgba(7,12,28,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:10px}
.top .ttl{font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .ttl small{display:block;font-weight:600;font-size:.72rem;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase}
.backbtn{min-height:44px;min-width:44px;padding:6px 12px;border-radius:999px;font-size:.88rem;background:rgba(255,255,255,.06);border:1px solid var(--line);flex:0 0 auto}
.locked [data-act]:not([data-act=tip]):not([data-act=back]):not([data-act=fwd]):not([data-act=front]):not([data-act=t2]){display:none}
.locked #draghint{display:none}.locked .drag{cursor:default}
.lookback{text-align:center;font-size:.78rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--yellow);background:rgba(255,210,63,.08);border:1px solid rgba(255,210,63,.25);border-radius:999px;padding:6px 12px;margin:0 0 12px}
.xs{padding:10px 0;border-bottom:1px solid var(--line)}.xs:last-of-type{border-bottom:0}
.xs.off{opacity:.4}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.stages button{min-height:58px;padding:6px 6px;font-size:.8rem;line-height:1.15;background:rgba(255,255,255,.04);overflow-wrap:normal;word-break:normal;hyphens:manual}
.stages button small{display:block;font-size:.7rem;color:var(--faint);font-weight:800;margin-bottom:2px}
.stages button.on{background:linear-gradient(135deg,var(--mint),var(--green));color:#04261A;border-color:transparent}
.stages button.on small{color:#04261A}
.xsay{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(86,224,255,.07);border:1px solid rgba(86,224,255,.22);font-size:.92rem;min-height:3.2em}
.xs{padding:6px 0}
.xl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}
.xl b{font-size:1.1rem;color:var(--cyan)}
.xs input[type=range]{height:44px}
.xs input[type=range]::-webkit-slider-runnable-track{background:rgba(255,255,255,.12)}
.score{margin-left:auto;font-weight:800;white-space:nowrap;background:rgba(61,220,132,.12);color:var(--mint);border:1px solid rgba(61,220,132,.3);padding:5px 12px;border-radius:999px;font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}
.steps i{height:4px;border-radius:999px;background:rgba(255,255,255,.1)}
.steps i.done{background:linear-gradient(90deg,var(--green),var(--mint))}
.steps i.now{background:linear-gradient(90deg,var(--orange),var(--orange2));box-shadow:0 0 10px rgba(255,138,31,.6)}
/* cards */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 18px 40px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}
h1{font-size:2.3rem;line-height:1.02;margin:.15em 0 .25em;letter-spacing:-.8px}
h2{font-size:1.35rem;margin:.05em 0 .25em;line-height:1.15;letter-spacing:-.3px}
h3{font-size:1.05rem;margin:.05em 0 .45em;letter-spacing:-.1px}
p{margin:.35em 0}
h1,h2,h3,p,td,th,.bubble,button{overflow-wrap:break-word}
.dim{color:var(--dim)}
.small{font-size:.88rem}
.eyebrow{font-size:.72rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 0 4px}
/* company header */
.co{display:flex;gap:12px;align-items:center}
.badge{flex:0 0 52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.78rem;letter-spacing:.5px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 20px -8px var(--c1),inset 0 1px 0 rgba(255,255,255,.3)}
.ask{margin:12px 0 0;padding:10px 12px;border-radius:14px;background:rgba(255,210,63,.07);border:1px solid rgba(255,210,63,.18);font-weight:700}
.ask span{display:block;font-size:.72rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--yellow);font-weight:800;margin-bottom:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.fact{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-width:0}
.fact span{display:block;font-size:.76rem;color:var(--dim)}
.fact b{font-size:1.25rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;column-gap:2px;margin-top:6px}
.meta .gap{width:14px}
.nw{white-space:nowrap;display:inline-flex;align-items:center}
/* Mango */
.mango{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px}
.mface{flex:0 0 52px;height:52px;border-radius:50%;position:relative;box-shadow:0 0 0 2px #E9B949,0 6px 16px -6px rgba(233,185,73,.6)}
.mface img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.bubble{position:relative;background:#FFF7E6;color:#1A1A2B;border-radius:18px 18px 18px 6px;padding:11px 14px;flex:1;font-weight:600;min-width:0;box-shadow:0 10px 26px -14px rgba(0,0,0,.8)}
.bubble:before{content:"";position:absolute;left:-7px;top:16px;border:8px solid transparent;border-right-color:#FFF7E6;border-left:0}
.bubble ol{margin:6px 0 0;padding-left:20px}
.bubble li{margin:2px 0}
/* chart */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.drag{position:relative;touch-action:pan-y;cursor:ew-resize;border-radius:12px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.drag:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
.chart .readout{margin:4px 0 8px}
.readout .ph{font-size:1rem;font-weight:700;color:var(--faint);-webkit-text-fill-color:var(--faint);letter-spacing:0}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.drawn{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1.1s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hidden-veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hidden-veil span{background:rgba(7,12,28,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1.5px dashed rgba(255,210,63,.8);color:var(--yellow);font-weight:800;padding:9px 16px;border-radius:999px;letter-spacing:.3px}
.caption{font-size:.84rem;color:var(--dim);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--dim);margin-top:6px}
.legend i.box{width:14px;height:10px;border-radius:2px;border:1px solid rgba(201,210,238,.55)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* slider */
.slider{margin:16px 2px 4px;position:relative}
.readout{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:22px}
.readout .lbl{display:block;font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);font-weight:800}
.readout b{font-size:1.9rem;font-weight:900;letter-spacing:-.5px;display:inline-block;line-height:1.05}
.readout .v{text-align:right}
.readout .v b{font-size:1.35rem;background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.bump{animation:bump .2s ease-out}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
.track{position:relative;height:48px}
.tipb{position:absolute;top:-24px;left:var(--pos,0%);transform:translateX(-50%);background:var(--orange);color:#231000;font-weight:900;font-size:.8rem;padding:2px 9px;border-radius:999px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 14px -6px rgba(255,138,31,.9);transition:opacity .2s}
.tipb:after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--orange);border-bottom:0}
.untouched .tipb{opacity:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;cursor:pointer;position:relative;z-index:1}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--blue) 0,var(--cyan) var(--fill,0%),rgba(255,255,255,.1) var(--fill,0%));box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:12px;border-radius:999px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFC27A,#FF8A1F 65%);border:4px solid #FFF7E6;box-shadow:0 0 0 6px rgba(255,138,31,.18),0 6px 16px rgba(0,0,0,.55);transition:transform .14s ease,box-shadow .2s ease}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#FF8A1F;border:4px solid #FFF7E6;box-shadow:0 0 0 6px rgba(255,138,31,.18)}
input[type=range]:active::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{transform:scale(1.15);box-shadow:0 0 0 10px rgba(255,138,31,.22),0 6px 16px rgba(0,0,0,.55)}
.untouched input[type=range]::-webkit-slider-thumb{background:radial-gradient(circle at 35% 30%,#5B6A94,#36446E 70%);box-shadow:0 0 0 6px rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.55)}
.untouched input[type=range]::-moz-range-thumb{background:#36446E}
.ticks{display:flex;justify-content:space-between;font-size:.74rem;color:var(--faint);margin-top:-6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
/* news */
.news{position:relative;border-radius:var(--r);overflow:hidden;margin:0 0 14px;background:linear-gradient(180deg,#22101A,#170B12);border:1px solid rgba(230,57,70,.55);box-shadow:0 18px 40px -20px rgba(230,57,70,.5)}
.news .bar{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#E63946,#C81D3A);color:#fff;font-weight:900;letter-spacing:2px;font-size:.8rem;padding:8px 14px;position:relative;overflow:hidden}
.news .bar:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 2.4s ease-in-out .3s 2}
@keyframes sweep{to{transform:translateX(100%)}}
.news .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.15}}
.news .bar i{margin-left:auto;font-style:normal;font-weight:700;letter-spacing:1px;font-size:.7rem;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:999px}
.news .body{padding:14px 16px 12px}
.news h2{font-size:1.5rem;font-weight:900;letter-spacing:-.5px;line-height:1.12}
.news p{color:#F3D8DC}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid rgba(230,57,70,.25);background:rgba(0,0,0,.25);font-size:.8rem;font-weight:700;letter-spacing:.6px;color:#FF9AA5;padding:6px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 18s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.news.flash{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.news.compact .body{padding:10px 14px}
/* results */
.big{font-size:2.6rem;font-weight:900;line-height:1.05;letter-spacing:-1px}
.pos{background:linear-gradient(90deg,var(--mint),var(--green) 60%,#2BC6A0);-webkit-background-clip:text;background-clip:text;color:transparent}
.neg{background:linear-gradient(90deg,#FF9A8B,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.vs{display:flex;gap:8px;margin-top:10px}
.vs div{flex:1;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.vs span{display:block;font-size:.74rem;color:var(--dim)}
.vs span.tag,.vs span.pts{display:inline-block;font-size:.86rem}
.vs span.pts{font-size:1rem;color:var(--mint)}
.vs b{font-size:1.05rem}
.brk{width:100%;border-collapse:collapse;margin-top:12px;font-size:.94rem}
.brk td{padding:8px 4px;border-top:1px solid var(--line)}
.brk td:last-child,.brk th:last-child,.brk td:nth-child(2),.brk th:nth-child(2){text-align:right;white-space:nowrap}
.brk th{font-size:.76rem;color:var(--dim);text-align:left;font-weight:600;padding:4px}
.brk tr.tot td{font-weight:800;border-top:1.5px solid rgba(255,255,255,.3)}
.bar-in{display:block;height:4px;border-radius:999px;margin-top:4px;background:var(--c);width:var(--w)}
.tag{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.86rem;background:var(--panel2);vertical-align:middle}
.tag.good{background:linear-gradient(135deg,var(--mint),var(--green));color:#04261A}.tag.mid{background:linear-gradient(135deg,#FFE27A,var(--yellow));color:#2A2000}.tag.bad{background:linear-gradient(135deg,#FF9A8B,var(--red));color:#2A0606}
.pts{display:inline-block;font-weight:800;color:var(--mint);margin-left:6px;animation:rise .5s .9s both}
/* mcq */
.opts{display:grid;gap:9px;margin-top:8px}
.opt{text-align:left;font-weight:600;background:rgba(255,255,255,.035);border:1.5px solid rgba(255,255,255,.1);padding:12px 14px;line-height:1.35}
.opt[aria-pressed=true]{background:linear-gradient(135deg,rgba(255,138,31,.95),rgba(255,179,71,.95));color:#231000;border-color:transparent;box-shadow:0 8px 20px -10px rgba(255,138,31,.8)}
.opt.right{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.opt.wrong{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.seg .opt{text-align:center;padding:12px 6px}
.qn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);font-size:.85rem;font-weight:900;margin-right:8px}
.tipbtn{min-width:44px;min-height:44px;padding:0;border-radius:50%;background:transparent;border:0;color:var(--blue);font-size:1.1rem;vertical-align:middle}
.tip{display:block;background:rgba(0,0,0,.3);border:1px solid rgba(107,182,255,.25);border-left:3px solid var(--blue);border-radius:12px;padding:9px 12px;margin:6px 0;font-size:.88rem;color:var(--dim);flex-basis:100%}
/* reflection */
.veil{position:fixed;inset:0;background:rgba(3,6,15,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;animation:rise .4s ease-out}
.veil .card{max-width:520px;width:100%;border:1px solid rgba(255,210,63,.45);box-shadow:0 30px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,210,63,.15)}
.ring{height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}
.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));width:0;transition:width linear}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cmp div{border-radius:14px;padding:10px 12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.cmp span{display:block;font-size:.76rem;color:var(--dim)}
.cmp b{font-size:1.25rem}
/* debrief */
.rule{font-size:1.18rem;font-weight:800;line-height:1.35;background:linear-gradient(90deg,#FFF7E6,#FFD9A8);-webkit-background-clip:text;background-clip:text;color:transparent}
.dl{display:grid;gap:8px}
.dl .it{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.dl .it b{color:var(--orange2)}
.dl .hd{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px;font-size:.74rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);font-weight:800}
/* board review */
.review{position:relative;background:#FDFBF5;color:#1A2033;border-radius:14px;overflow:hidden;margin:20px 0 16px;font-variant-numeric:tabular-nums;box-shadow:0 26px 60px -24px rgba(0,0,0,.95),0 0 0 1px rgba(233,185,73,.4)}
.review .lh{background:linear-gradient(135deg,#0E1A3D,#1B2C63);color:#FFF7E6;padding:16px 16px 14px;border-bottom:3px solid #E9B949;display:flex;gap:12px;align-items:center}
.review .lh img{width:46px;height:46px;border-radius:12px;box-shadow:0 0 0 1.5px #E9B949}
.review .lh h2{margin:0;font-size:.98rem;letter-spacing:1.2px;text-transform:uppercase;line-height:1.2}
.review .lh p{margin:2px 0 0;font-size:.78rem;color:#C9D2EE;letter-spacing:.4px}
.review .bd{padding:14px 16px 16px}
.review .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:.86rem}
.review .fields span{display:block;font-size:.68rem;letter-spacing:1.3px;text-transform:uppercase;color:#7A8095;font-weight:800}
.review .fields b{font-size:.98rem}
.review .rating{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#F7EED6,#F2E3B8);border:1px solid #E2CC8C}
.review .rating .sc{font-size:2.3rem;font-weight:900;letter-spacing:-1px;line-height:1}
.review .rating .sc small{font-size:1rem;color:#6B6040;font-weight:700}
.review .rating .lb{text-align:right}
.review .rating .lb span{display:block;font-size:.68rem;letter-spacing:1.3px;text-transform:uppercase;color:#7A6A3A;font-weight:800}
.review .rating .lb b{display:inline-block;margin-top:3px;background:linear-gradient(135deg,#C8902B,#E9B949);color:#2A1C00;padding:4px 12px;border-radius:999px;font-size:.92rem}
.review h3{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:#7A8095;margin:16px 0 6px}
.review table{width:100%;border-collapse:collapse;font-size:.8rem;table-layout:fixed}
.review th{overflow-wrap:normal;word-break:normal;hyphens:none;font-size:.64rem;letter-spacing:.3px;line-height:1.2;vertical-align:bottom;text-transform:uppercase;color:#7A8095;font-weight:800;padding:4px 3px;border-bottom:1.5px solid #1A2033;text-align:right}
.review td{padding:7px 3px;border-bottom:1px solid #E6E1D3;text-align:right;overflow-wrap:anywhere}
.review th:first-child,.review td:first-child{text-align:left}
.review th:nth-child(1){width:25%}.review th:nth-child(2){width:19%}.review th:nth-child(3),.review th:nth-child(4){width:22%}.review th:nth-child(5){width:12%}
.review tr:nth-child(even) td{background:#F7F4EA}
.review .assess{margin:4px 0 0;font-size:.92rem;line-height:1.45}
.review .sig{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:18px}
.review .sig div{flex:1;border-top:1.5px solid #1A2033;padding-top:4px;font-size:.78rem;color:#4A5068}
.review .sig i{display:block;font-size:1.05rem;color:#1A2033;font-weight:600}
.review .seal{width:62px;height:62px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #E9B949,0 0 0 5px #FDFBF5,0 0 0 6.5px #C8902B;transform:rotate(-8deg)}
.review .note{font-size:.76rem;color:#6A7088;margin-top:12px}
.review .tipbtn{color:#1F5FA8}
.review .tip{background:#F1ECDD;color:#1A2033;border-color:#D8CDAF;border-left-color:#1F5FA8}
.copy{margin-top:14px;text-align:center;font-weight:700;font-size:.92rem}
/* deal toy */
.toywrap{margin:18px 0 6px}
.toy{width:230px;margin:6px auto 0;perspective:700px}
.toy .block{position:relative;overflow:hidden;padding:20px 16px 18px;text-align:center;border-radius:6px;transform:rotateX(6deg);
  background:linear-gradient(160deg,rgba(220,240,255,.30),rgba(150,190,230,.12) 45%,rgba(220,240,255,.22));
  border:1px solid rgba(220,240,255,.55);box-shadow:inset 0 0 0 4px rgba(255,255,255,.06),inset 0 14px 30px rgba(255,255,255,.12),0 22px 30px -18px rgba(0,0,0,.9);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);color:#EAF4FF;text-shadow:0 1px 0 rgba(0,0,0,.35),0 0 8px rgba(160,210,255,.35)}
.toy .shine{position:absolute;inset:-40% -60%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-60%);animation:toyshine 3.2s ease-in-out 1s 2}
@keyframes toyshine{to{transform:translateX(60%)}}
.toy .tk{display:inline-block;font-size:.66rem;font-weight:900;letter-spacing:1.5px;border:1px solid rgba(234,244,255,.6);border-radius:4px;padding:1px 6px;margin-bottom:6px}
.toy .co2{font-size:.95rem;font-weight:800;letter-spacing:.3px}
.toy .amt{font-size:1.7rem;font-weight:900;letter-spacing:-.5px;margin-top:6px;color:#F6DA8B;text-shadow:0 1px 0 rgba(0,0,0,.4),0 0 10px rgba(233,185,73,.45)}
.toy .kind{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;font-weight:800}
.toy .rule2{height:1px;background:rgba(234,244,255,.45);margin:10px 18px}
.toy .ln{font-size:.78rem;line-height:1.3}
.toy .adv{font-size:.7rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;margin-top:10px}
.toy .who{font-size:.85rem;font-weight:700;margin-top:2px}
.toy .dt{font-size:.7rem;opacity:.85;margin-top:2px}
.toy .base{height:16px;margin:0 -10px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#1E2A4D,#0B1226);box-shadow:0 10px 18px -8px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.12)}
/* start */
.hero{text-align:center;padding:22px 18px 18px;margin-top:16px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-40% -20% auto;height:260px;background:radial-gradient(circle at 50% 50%,rgba(233,185,73,.25),rgba(233,185,73,0) 65%);pointer-events:none}
.start-icon{width:200px;height:200px;display:block;margin:0 auto 4px;position:relative;border-radius:44px;box-shadow:0 22px 44px -16px rgba(0,0,0,.9),0 0 0 1px rgba(233,185,73,.35),0 0 60px -10px rgba(233,185,73,.35);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,#F6DA8B,#E9B949 55%,#C8902B);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .q{font-size:1.15rem;font-weight:800;margin:12px 0 6px;line-height:1.3}
.tickers{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.tickers span{font-size:.72rem;font-weight:900;letter-spacing:.8px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim)}
label.nm{display:block;font-weight:700;margin:14px 0 6px;text-align:left}
input.text{width:100%;min-height:50px;border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);padding:8px 14px}
input.text:focus{border-color:var(--orange)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.drawn{stroke-dashoffset:0}}
</style>
</head>
<body>

function unlever(c){ return c.beta / (1 + (1 - c.T) * c.ND / c.E); }
function rating(cov, mult){ var r = CONFIG.RATINGS[0]; for (var i = 0; i < CONFIG.RATINGS.length; i++){ if (cov > CONFIG.RATINGS[i][0]) r = CONFIG.RATINGS[i]; } return { rating:r[1], spread:r[2] * mult }; }
function wMin(c){ return c.ND < 0 ? CONFIG.W_MIN_CASH : 0; }
// s: {bU, T, EBIT, spreadMult, wmin}
function buildCurve(s){
  var pts = [], n = Math.round((CONFIG.W_MAX - s.wmin) * 100), mult = s.spreadMult || 1, RF = s.RF || CONFIG.RF;
  for (var i = 0; i <= n; i++){
    var w = Math.round(s.wmin * 100 + i) / 100;
    var bL = s.bU * (1 + (1 - s.T) * w / (1 - w));     // Hamada (Eq. 14.23)
    var ke = RF + bL * (s.MRP || CONFIG.MRP);   // SML (Eq. 14.22)
    var kd, ka, V, rt = 'none', cov = Infinity;
    if (w <= 0 || s.perfect){ kd = RF; ka = w * kd * (1 - s.T) + (1 - w) * ke; V = s.EBIT * (1 - s.T) / ka; }
    else {
      kd = RF + 0.004; var seen = {};
      for (var it = 0; it < 200; it++){
        ka = w * kd * (1 - s.T) + (1 - w) * ke; V = s.EBIT * (1 - s.T) / ka;
        cov = s.EBIT / (kd * w * V);
        var r = rating(cov, mult), kdn = RF + r.spread; rt = r.rating;
        if (Math.abs(kdn - kd) < 1e-12) break;
        var key = kdn.toFixed(8);
        if (seen[key]){ kd = Math.max(kd, kdn); ka = w * kd * (1 - s.T) + (1 - w) * ke; V = s.EBIT * (1 - s.T) / ka; cov = s.EBIT / (kd * w * V); rt = rating(cov, mult).rating; break; }
        seen[key] = 1; kd = kdn;
      }
    }
    pts.push({ w:w, bL:bL, ke:ke, kd:kd, ka:ka, V:V, D:w * V, TB:s.T * w * V, rating:rt });
  }
  var v0 = pts[Math.round(-s.wmin * 100)].V;
  pts.forEach(function(p){ p.dV = p.V - v0; p.CRR = p.TB - p.dV; });   // cost of rising rates = TB − (V(w) − V(0))
  pts.wmin = s.wmin;
  return pts;
}
function idx(pts, w){ return Math.max(0, Math.min(pts.length - 1, Math.round((w - pts.wmin) * 100))); }
function at(pts, w){ return pts[idx(pts, w)]; }
var COSTS = { up:CONFIG.COST_UP, down:CONFIG.COST_DOWN };   // the explorer swaps these briefly; the game always uses CONFIG
function tcost(Dold, Dnew){ var d = Dnew - Dold; return d >= 0 ? d * COSTS.up : -d * COSTS.down; }
function move(pts, wOld, wNew){ var a = at(pts, wOld), b = at(pts, wNew), c = tcost(a.D, b.D); return { from:a, to:b, gain:b.V - a.V, cost:c, net:b.V - a.V - c }; }
function bestMove(pts, wOld){ var best = null; for (var i = 0; i < pts.length; i++){ var m = move(pts, wOld, pts[i].w); if (!best || m.net > best.net + 1e-12) best = m; } return best; }
function worstMove(pts, wOld){ var worst = null; for (var i = 0; i < pts.length; i++){ var m = move(pts, wOld, pts[i].w); if (!worst || m.net < worst.net) worst = m; } return worst; }
function holdBand(pts){ var lo = null, hi = null; for (var i = 0; i < pts.length; i++){ if (bestMove(pts, pts[i].w).net <= 1e-9){ if (lo === null) lo = pts[i].w; hi = pts[i].w; } } return lo === null ? null : [lo, hi]; }
function realBand(b){ return b && b[1] - b[0] >= 0.02 - 1e-9 ? b : null; }
function peak(pts){ return pts.reduce(function(a, p){ return p.V > a.V ? p : a; }); }
function shareOf(m, best){ var scale = Math.max(best.net, CONFIG.SCORE_FLOOR * best.from.V); return Math.max(0, Math.min(1, 1 - (best.net - m.net) / scale)); }

/* Precompute every round once. Deterministic: reloads cannot change results. */
var MODEL = COMPANIES.map(function(c){
  var bU = unlever(c), wmin = wMin(c), base = { bU:bU, T:c.T, EBIT:c.EBIT, spreadMult:1, wmin:wmin };
  var sh = c.shock, news = { bU:bU * (sh.bUMult || 1), T:sh.T || c.T, EBIT:c.EBIT, spreadMult:sh.spreadMult || 1, MRP:sh.MRP || CONFIG.MRP, wmin:wmin };
  var p0 = buildCurve(base), p1 = buildCurve(news);
  return { c:c, w0:Math.round(c.ND / (c.ND + c.E) * 100) / 100, p0:p0, p1:p1, band0:realBand(holdBand(p0)), band1:realBand(holdBand(p1)), news:news };
});

function totals(){

function xOff(k){ var st = ui.x.stage; return (st === 1 && (k === 'T' || k === 'up' || k === 'down')) || (k === 'spreadMult' && st < 3); }

function xCurve(){ var x = ui.x; return buildCurve({ bU:x.bU, T:x.stage === 1 ? 0 : x.T, EBIT:SAMPLE.EBIT, spreadMult:x.spreadMult, RF:x.RF, MRP:x.MRP, perfect:x.stage < 3, wmin:0 }); }

/* Look back: re-read earlier screens. Scored choices stay locked. */

  else if (S.step === 'news') html = newsScreen();
  else if (S.step === 'bet') html = betScreen();

/* Drag the line on the chart (pointer) or use arrow keys. Updates in place, so focus and pointer capture survive. */

/* ======================= ACTIONS ======================= */
function shuffle(n, seed){ var a = []; for (var i = 0; i < n; i++) a.push(i); var s = seed; for (var j = n - 1; j > 0; j--){ s = (s * 9301 + 49297) % 233280; var k = Math.floor(s / 233280 * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; }
var busy = false;
document.addEventListener('click', function(e){

  var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  if (act === 'explore'){ var nmv = (document.getElementById('nm') || {}).value; if (nmv !== undefined) ui.nameDraft = nmv; openExplore(S && S.step === 'done' ? 'end' : 'start'); return; }
  if (act === 'xdone'){ ui.x = null; render('h1,h2'); window.scrollTo(0, 0); var nmi = document.getElementById('nm'); if (nmi && ui.nameDraft) nmi.value = ui.nameDraft; return; }

  if (act === 'front'){ ui.vi = null; ui.tips = {}; render('h2,h3'); window.scrollTo(0, 0); return; }
  if (ui.vi !== null && ui.vi !== undefined && act !== 'tip') return;
  if (busy && act !== 'tip') return;

  }

  setTimeout(function(){ ui.reflectReady = true; if (ui.reflectOpen){ var y = window.scrollY; render('[data-act=reflectdone]'); window.scrollTo(0, y); var rg = document.getElementById('ring'); if (rg){ rg.style.transitionDuration = '0ms'; rg.style.width = '100%'; } } }, CONFIG.REFLECT_MS);

document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target.id === 'nm'){ var b = document.querySelector('[data-act=start]'); if (b) b.click(); } });

/* Resume mid-game on reload; otherwise start page. */
(function(){ var s = load(); if (s && s.step && s.step !== 'start' && s.step !== 'done'){ S = null; } render(); })();
try { history.replaceState({ mm:0 }, ''); history.pushState({ mm:1 }, ''); } catch (e) {}
window.addEventListener('popstate', function(){ if (ui.x){ ui.x = null; render(); try { history.pushState({ mm:1 }, ''); } catch (e) {} return; } if (doBack()){ try { history.pushState({ mm:1 }, ''); } catch (e) {} } else if (S && S.step !== 'start'){ try { history.pushState({ mm:1 }, ''); } catch (e) {} } });

/* Test hook (no effect on play) */
window.__MM = { COSTS:function(){ return COSTS; }, holdBand:holdBand, buildCurve:buildCurve, peak:peak, SAMPLE:SAMPLE, CH:CH, CONFIG:CONFIG, MODEL:MODEL, move:move, bestMove:bestMove, worstMove:worstMove, shareOf:shareOf, peak:peak, holdBand:holdBand, state:function(){ return S; } };
